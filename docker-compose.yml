services:
  polkagent:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${POLKAGENT_HTTP_PORT:-8080}:8080"
    volumes:
      - polkagent-data:/data
    environment:
      POLKAGENT_DATABASE_SQLITE_PATH: /data/polkagent.db
      POLKAGENT_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

volumes:
  polkagent-data:
