[workspace]
resolver = "2"
members = [
    "crates/polkagent-core",
    "crates/polkagent-store-trait",
    "crates/polkagent-executor-trait",
    "crates/polkagent-signer-trait",
    "crates/polkagent-chain-trait",
    "crates/polkagent-transport-trait",
    "crates/polkagent-run",
    "crates/polkagent-effect",
    "crates/polkagent-grant",
    "crates/polkagent-artifact",
    "crates/polkagent-event",
    "crates/polkagent-config",
    "crates/polkagent-outbox",
    "crates/polkagent-card",
    "crates/polkagent-store-sqlite",
    "crates/polkagent-executor-fake",
    "crates/polkagent-executor-anthropic",
    "crates/polkagent-executor-openai",
    "crates/polkagent-executor-gemini",
    "crates/polkagent-executor-local",
    "crates/polkagent-signer-fake",
    "crates/polkagent-chain-fake",
    "crates/polkagent-signer-external",
    "crates/polkagent-signer-watchonly",
    "crates/polkagent-transport-fake",
    "crates/polkagent-api",
    "crates/polkagent-cli",
    "crates/polkagent-test-fixtures",
    "crates/polkagent-metadata",
    "crates/polkagent-integration-tests",
    "crates/polkagent-memory",
    "crates/polkagent-tool",
    "crates/polkagent-skill",
    "crates/polkagent-telemetry",
    "crates/polkagent-harness-trait",
    "crates/polkagent-harness-claude",
    "crates/polkagent-harness-codex",
    "crates/polkagent-security-tests",
    "crates/polkagent-secret",
    "crates/polkagent-identity",
    "crates/polkagent-payment",
    "crates/polkagent-conversation",
    "crates/polkagent-service",
    "crates/polkagent-group",
    "crates/polkagent-eval",
    "crates/polkagent-codec",
    "crates/polkagent-feed",
    "crates/polkagent-fault",
    "crates/polkagent-health",
    "crates/polkagent-audit",
    "crates/polkagent-batch",
    "crates/polkagent-cache",
    "crates/polkagent-chain-subxt",
    "crates/polkagent-context",
    "crates/polkagent-migration",
    "crates/polkagent-plugin",
    "crates/polkagent-rate-limit",
    "crates/polkagent-retry",
    "crates/polkagent-scheduler",
    "crates/polkagent-store-sqlite-feed",
    "crates/polkagent-store-sqlite-group",
    "crates/polkagent-surface-webhook",
    "crates/polkagent-tool-governance",
    "crates/polkagent-tool-treasury",
    "crates/polkagent-tool-workbench",
    "crates/polkagent-transport-pca",
    "crates/polkagent-harness-acp",
    "crates/polkagent-harness-cursor",
    "crates/polkagent-harness-copilot",
    "crates/polkagent-harness-goose",
    "crates/polkagent-harness-kiro",
    "crates/polkagent-executor-openrouter",
    "crates/polkagent-action-sign",
    "crates/polkagent-action-governance",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/nicovince/polkagent"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }

# Crypto
blake3 = "1"
blake2 = "0.10"
twox-hash = "1"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
zeroize = { version = "1", features = ["derive"] }

# Web
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ureq = "2"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Regex
regex = "1"

# Compression
zstd = "0.13"

# Utils
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12"
bytes = "1"
dirs = "5"
semver = { version = "1", features = ["serde"] }

# Testing
proptest = "1"
tempfile = "3"
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
