[package]
name = "polkagent-integration-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-crate end-to-end integration tests for the Polkagent platform"
publish = false

# This crate has no lib.rs — it is test-only.
[lib]
name = "polkagent_integration_tests"
path = "src/lib.rs"

[dependencies]
# Internal crates under test
polkagent-core = { path = "../polkagent-core" }
polkagent-store-trait = { path = "../polkagent-store-trait" }
polkagent-run = { path = "../polkagent-run" }
polkagent-event = { path = "../polkagent-event" }
polkagent-effect = { path = "../polkagent-effect" }
polkagent-grant = { path = "../polkagent-grant" }
polkagent-artifact = { path = "../polkagent-artifact" }
polkagent-config = { path = "../polkagent-config" }
polkagent-test-fixtures = { path = "../polkagent-test-fixtures" }
polkagent-executor-trait = { path = "../polkagent-executor-trait", features = ["test-contracts"] }
polkagent-executor-fake = { path = "../polkagent-executor-fake" }
polkagent-signer-trait = { path = "../polkagent-signer-trait", features = ["test-contracts"] }
polkagent-signer-fake = { path = "../polkagent-signer-fake" }
polkagent-memory = { path = "../polkagent-memory" }
polkagent-metadata = { path = "../polkagent-metadata" }

# Async
tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Crypto
blake3 = { workspace = true }

# Config
toml = { workspace = true }

# Testing
tempfile = { workspace = true }

[lints]
workspace = true
