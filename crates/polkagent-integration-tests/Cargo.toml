[package]
name = "polkagent-integration-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-crate end-to-end integration tests for the Polkagent platform"
publish = false

# This crate has no lib.rs — it is test-only.
[lib]
name = "polkagent_integration_tests"
path = "src/lib.rs"

[dependencies]
# Internal crates under test
polkagent-core = { path = "../polkagent-core" }
polkagent-store-trait = { path = "../polkagent-store-trait" }
polkagent-run = { path = "../polkagent-run" }
polkagent-event = { path = "../polkagent-event" }
polkagent-effect = { path = "../polkagent-effect" }
polkagent-grant = { path = "../polkagent-grant" }
polkagent-artifact = { path = "../polkagent-artifact" }
polkagent-config = { path = "../polkagent-config" }
polkagent-test-fixtures = { path = "../polkagent-test-fixtures" }
polkagent-executor-trait = { path = "../polkagent-executor-trait", features = ["test-contracts"] }
polkagent-executor-fake = { path = "../polkagent-executor-fake" }
polkagent-signer-trait = { path = "../polkagent-signer-trait", features = ["test-contracts"] }
polkagent-signer-fake = { path = "../polkagent-signer-fake" }
polkagent-memory = { path = "../polkagent-memory" }
polkagent-metadata = { path = "../polkagent-metadata" }
polkagent-fault = { path = "../polkagent-fault" }
polkagent-transport-fake = { path = "../polkagent-transport-fake" }
# IT-04: Outbox delivery tests
polkagent-outbox = { path = "../polkagent-outbox" }
# IT-06: Executor streaming tests (already have polkagent-executor-fake above)
# IT-08: Signer integration tests (already have polkagent-signer-fake above)
# Tool execution tests
polkagent-tool = { path = "../polkagent-tool" }
# Skill resolution tests
polkagent-skill = { path = "../polkagent-skill" }
# Conversation flow tests
polkagent-conversation = { path = "../polkagent-conversation" }
# Service lifecycle tests
polkagent-service = { path = "../polkagent-service" }
polkagent-payment = { path = "../polkagent-payment" }
# Phase 2: Explain-before-sign crates
polkagent-codec = { path = "../polkagent-codec" }
polkagent-card = { path = "../polkagent-card" }
polkagent-chain-trait = { path = "../polkagent-chain-trait" }
polkagent-chain-fake = { path = "../polkagent-chain-fake" }
# New integration test crates
polkagent-group = { path = "../polkagent-group" }
polkagent-feed = { path = "../polkagent-feed" }
polkagent-eval = { path = "../polkagent-eval" }
# Infrastructure crates (cache, retry, rate-limit, audit, scheduler, batch)
polkagent-cache = { path = "../polkagent-cache" }
polkagent-retry = { path = "../polkagent-retry" }
polkagent-rate-limit = { path = "../polkagent-rate-limit" }
polkagent-audit = { path = "../polkagent-audit" }
polkagent-scheduler = { path = "../polkagent-scheduler" }
polkagent-batch = { path = "../polkagent-batch" }

# Async
tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# UUIDs (used directly in several test files)
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# Crypto
blake3 = { workspace = true }

# Config
toml = { workspace = true }

# Testing
tempfile = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
