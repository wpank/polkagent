[package]
name = "polkagent-store-sqlite-group"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite GroupStore implementation, isolated to avoid serde trait-solver recursion"

[lints]
workspace = true

[dependencies]
# Internal
polkagent-group = { path = "../polkagent-group" }
polkagent-core = { path = "../polkagent-core" }
polkagent-store-sqlite = { path = "../polkagent-store-sqlite" }

# Database
rusqlite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Errors
thiserror = { workspace = true }

# Observability
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# IDs
uuid = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
