[package]
name = "polkagent-effect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Effect pipeline: durable intent-before-I/O, lease-based claim, idempotency, and crash recovery"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-store-trait = { path = "../polkagent-store-trait" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Async
tokio = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Crypto
blake3 = { workspace = true }

# IDs
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
