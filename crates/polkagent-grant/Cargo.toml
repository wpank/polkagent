[package]
name = "polkagent-grant"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Policy evaluation, grant resolution, and gate system for the Polkagent platform"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }

# Async
async-trait = { workspace = true }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Time
chrono = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Crypto (used for deterministic principal-to-AgentId mapping)
blake3 = { workspace = true }

# IDs
uuid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
