[package]
name = "polkagent-cloud-control"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cloud control plane: job queue, worker registration, and job assignment"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-config = { path = "../polkagent-config" }
polkagent-grant = { path = "../polkagent-grant" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Errors
thiserror = { workspace = true }

# Observability
tracing = { workspace = true }

# Utils
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
