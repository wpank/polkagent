[package]
name = "polkagent-artifact"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Content-addressed artifact storage: creation, retrieval, digest verification, and lineage tracking"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-store-trait = { path = "../polkagent-store-trait" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Crypto
blake3 = { workspace = true }
sha2 = "0.10"

# Async
tokio = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
proptest = { workspace = true }
