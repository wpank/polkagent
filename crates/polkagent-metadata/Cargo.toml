[package]
name = "polkagent-metadata"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Metadata service for Polkadot chain metadata fetching, caching, pinning, and drift detection"

[features]
default = []
cached = ["polkagent-cache"]

[dependencies]
polkagent-core = { path = "../polkagent-core" }
polkagent-codec = { path = "../polkagent-codec" }
polkagent-cache = { path = "../polkagent-cache", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
hex = "0.4"

[dev-dependencies]
polkagent-cache = { path = "../polkagent-cache" }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
