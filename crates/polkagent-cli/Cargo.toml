[package]
name = "polkagent-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Polkagent command-line interface and terminal UI (ROSEDUST)"

[lib]
name = "polkagent_cli"
path = "src/lib.rs"

[[bin]]
name = "polkagent"
path = "src/main.rs"

[dependencies]
# Internal crates
polkagent-core            = { path = "../polkagent-core" }
polkagent-config          = { path = "../polkagent-config" }
polkagent-store-sqlite    = { path = "../polkagent-store-sqlite" }
polkagent-store-trait     = { path = "../polkagent-store-trait" }
polkagent-memory          = { path = "../polkagent-memory" }
polkagent-telemetry       = { path = "../polkagent-telemetry" }
polkagent-eval            = { path = "../polkagent-eval" }
polkagent-executor-anthropic = { path = "../polkagent-executor-anthropic" }
polkagent-executor-fake   = { path = "../polkagent-executor-fake" }
polkagent-executor-local  = { path = "../polkagent-executor-local" }
polkagent-executor-openai = { path = "../polkagent-executor-openai" }
polkagent-executor-trait  = { path = "../polkagent-executor-trait" }
polkagent-api             = { path = "../polkagent-api" }
polkagent-identity        = { path = "../polkagent-identity" }
polkagent-event           = { path = "../polkagent-event" }
polkagent-service         = { path = "../polkagent-service" }
polkagent-chain-trait     = { path = "../polkagent-chain-trait" }
polkagent-chain-fake      = { path = "../polkagent-chain-fake" }
polkagent-harness-trait   = { path = "../polkagent-harness-trait" }
polkagent-harness-codex   = { path = "../polkagent-harness-codex" }
polkagent-harness-cursor  = { path = "../polkagent-harness-cursor" }
polkagent-harness-claude  = { path = "../polkagent-harness-claude" }
polkagent-harness-acp     = { path = "../polkagent-harness-acp" }
futures                   = { workspace = true }

# CLI
clap           = { workspace = true }
clap_complete  = "4"

# Async
tokio = { workspace = true }

# TUI
ratatui   = { workspace = true }
crossterm = { workspace = true }

# HTTP (blocking — used by TUI chain poller)
ureq = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Observability
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Time
chrono = { workspace = true }

# Config parsing
toml = { workspace = true }

# IDs
uuid = { workspace = true }

# Database (direct SQLite access for TUI data queries)
rusqlite    = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
ratatui   = { workspace = true }
crossterm = { workspace = true }
proptest  = { workspace = true }
tempfile  = { workspace = true }

[lints]
workspace = true
