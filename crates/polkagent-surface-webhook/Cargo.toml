[package]
name = "polkagent-surface-webhook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP webhook delivery surface for sending agent events and responses to external services"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-event = { path = "../polkagent-event" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Observability
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# IDs
uuid = { workspace = true }

# HTTP
reqwest = { workspace = true }

# Crypto
blake3 = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
proptest = { workspace = true }

[lints]
workspace = true
