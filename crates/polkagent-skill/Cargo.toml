[package]
name = "polkagent-skill"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Skill package loading, validation, dependency resolution, and execution for the Polkagent platform"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Async
tokio = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Semver
semver = { workspace = true }

# Filesystem
dirs = { workspace = true }

[features]
evolutionary = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
