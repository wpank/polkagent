[package]
name = "polkagent-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "REST API server for the Polkagent platform"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-store-trait = { path = "../polkagent-store-trait" }
polkagent-config = { path = "../polkagent-config" }
polkagent-event = { path = "../polkagent-event" }

# Web
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Time
chrono = { workspace = true }

# IDs
uuid = { workspace = true }

[dev-dependencies]
axum-test = "21"
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
