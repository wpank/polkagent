[package]
name = "polkagent-run"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Run/Turn/Step lifecycle manager for the Polkagent platform"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-store-trait = { path = "../polkagent-store-trait" }
polkagent-event = { path = "../polkagent-event" }
polkagent-executor-trait = { path = "../polkagent-executor-trait" }
polkagent-effect = { path = "../polkagent-effect" }
polkagent-grant = { path = "../polkagent-grant" }
polkagent-card = { path = "../polkagent-card" }
polkagent-harness-trait = { path = "../polkagent-harness-trait" }
polkagent-payment = { path = "../polkagent-payment", optional = true }
polkagent-context = { path = "../polkagent-context", optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Async
tokio = { workspace = true }
futures = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# IDs
uuid = { workspace = true }

[features]
payment = ["dep:polkagent-payment"]
context = ["dep:polkagent-context"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }
futures = { workspace = true }
polkagent-payment = { path = "../polkagent-payment" }
polkagent-context = { path = "../polkagent-context" }

[lints]
workspace = true
