[package]
name = "polkagent-tool-workbench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Product-engineering workbench tools for Polkagent (storage migration rehearsal, upgrade analysis)"

[dependencies]
# Internal
polkagent-tool = { path = "../polkagent-tool" }
polkagent-core = { path = "../polkagent-core" }
polkagent-chain-trait = { path = "../polkagent-chain-trait" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
