[package]
name = "polkagent-tool"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tool registry, handler trait, and built-in tool implementations for Polkagent agents"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-batch = { path = "../polkagent-batch" }
polkagent-executor-trait = { path = "../polkagent-executor-trait" }
polkagent-grant = { path = "../polkagent-grant" }
polkagent-memory = { path = "../polkagent-memory" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Utils
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
