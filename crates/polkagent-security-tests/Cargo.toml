[package]
name = "polkagent-security-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Security verification tests for the Polkagent platform (PRD-15)"

[dependencies]
# Internal crates under test
polkagent-core = { path = "../polkagent-core" }
polkagent-effect = { path = "../polkagent-effect" }
polkagent-grant = { path = "../polkagent-grant" }
polkagent-card = { path = "../polkagent-card" }
polkagent-config = { path = "../polkagent-config" }
polkagent-executor-trait = { path = "../polkagent-executor-trait" }
polkagent-signer-trait = { path = "../polkagent-signer-trait" }
polkagent-store-trait = { path = "../polkagent-store-trait" }
polkagent-metadata = { path = "../polkagent-metadata" }
polkagent-identity = { path = "../polkagent-identity" }
polkagent-outbox = { path = "../polkagent-outbox" }
polkagent-tool = { path = "../polkagent-tool" }
polkagent-event = { path = "../polkagent-event" }
polkagent-payment = { path = "../polkagent-payment" }
polkagent-chain-trait = { path = "../polkagent-chain-trait" }
polkagent-chain-fake = { path = "../polkagent-chain-fake" }
polkagent-memory = { path = "../polkagent-memory" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true, features = ["full", "test-util"] }
async-trait = { workspace = true }

# Testing
proptest = { workspace = true }

# Time
chrono = { workspace = true }

# IDs
uuid = { workspace = true }

# Crypto
blake3 = { workspace = true }

# Hex encoding (used in red_team.rs for address encoding tests)
hex = "0.4"

# TOML serialization (used in supply_chain.rs for config tampering tests)
toml = { workspace = true }

[lints]
workspace = true
