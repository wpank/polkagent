[package]
name = "polkagent-store-sqlite"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite storage adapter for Polkagent with WAL mode and forward-only migrations"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-interaction = { path = "../polkagent-interaction" }
polkagent-artifact = { path = "../polkagent-artifact" }
polkagent-conversation = { path = "../polkagent-conversation" }
polkagent-payment = { path = "../polkagent-payment" }
# polkagent-feed and polkagent-group removed: their serde type graphs
# exceed rustc's trait-solver recursion limit. SQLite impls for these
# will live in dedicated crates.
polkagent-store-trait = { path = "../polkagent-store-trait" }

# Crypto
blake3 = { workspace = true }

# Database
rusqlite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# IDs
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
polkagent-store-trait = { path = "../polkagent-store-trait", features = ["test-contracts"] }
polkagent-payment = { path = "../polkagent-payment" }
polkagent-conversation = { path = "../polkagent-conversation" }
polkagent-core = { path = "../polkagent-core" }
polkagent-event = { path = "../polkagent-event" }
blake3 = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }

[[bench]]
name = "store"
harness = false

[lints]
workspace = true
