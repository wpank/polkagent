[package]
name = "polkagent-store-sqlite"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite storage adapter for Polkagent with WAL mode and forward-only migrations"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-artifact = { path = "../polkagent-artifact" }
polkagent-store-trait = { path = "../polkagent-store-trait" }

# Crypto
blake3 = { workspace = true }

# Database
rusqlite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# IDs
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
