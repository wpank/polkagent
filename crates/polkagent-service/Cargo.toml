[package]
name = "polkagent-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Application service layer that wires together all Polkagent components"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }
polkagent-store-trait = { path = "../polkagent-store-trait" }
polkagent-executor-trait = { path = "../polkagent-executor-trait" }
polkagent-signer-trait = { path = "../polkagent-signer-trait" }
polkagent-chain-trait = { path = "../polkagent-chain-trait" }
polkagent-effect = { path = "../polkagent-effect" }
polkagent-event = { path = "../polkagent-event" }
polkagent-run = { path = "../polkagent-run" }
polkagent-grant = { path = "../polkagent-grant" }
polkagent-artifact = { path = "../polkagent-artifact" }
polkagent-card = { path = "../polkagent-card" }
polkagent-config = { path = "../polkagent-config" }
polkagent-tool = { path = "../polkagent-tool" }
polkagent-memory = { path = "../polkagent-memory" }
polkagent-payment = { path = "../polkagent-payment" }
polkagent-skill = { path = "../polkagent-skill" }
polkagent-conversation = { path = "../polkagent-conversation" }
polkagent-identity = { path = "../polkagent-identity" }
polkagent-plugin = { path = "../polkagent-plugin" }
polkagent-metadata = { path = "../polkagent-metadata" }
polkagent-scheduler = { path = "../polkagent-scheduler" }
polkagent-surface-webhook = { path = "../polkagent-surface-webhook" }
polkagent-harness-trait = { path = "../polkagent-harness-trait" }
polkagent-executor-fake = { path = "../polkagent-executor-fake" }
polkagent-retry = { path = "../polkagent-retry" }

# Async
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# IDs
uuid = { workspace = true }

# Time
chrono = { workspace = true }

# Observability
tracing = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# Errors
thiserror = { workspace = true }

[features]
watcher = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
futures = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
polkagent-store-sqlite = { path = "../polkagent-store-sqlite" }

[lints]
workspace = true
