[package]
name = "polkagent-outbox"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable outbox with at-least-once delivery, FIFO partitioned ordering, and consumer deduplication"

[dependencies]
# Internal
polkagent-core = { path = "../polkagent-core" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Async
tokio = { workspace = true }

# Observability
tracing = { workspace = true }

# Errors
thiserror = { workspace = true }

# Crypto
blake3 = { workspace = true }

# IDs
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
