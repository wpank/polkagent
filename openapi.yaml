        Returns all models across every configured provider. Each provider
        contributes its `default_model`.
      responses:
        "200":
          description: List of all models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListModelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/models/{model_id}:
    parameters:
      - name: model_id
        in: path
        required: true
        description: Model identifier (e.g. `claude-opus-4-6`).
        schema:
          type: string
    get:
      operationId: getModel
      summary: Get a model
      tags: [models]
      description: |
        Returns metadata for a single model. Searches all configured
        providers for a matching `default_model`.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Model found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================================================
  # Skills
  # ==========================================================================

  /api/v1alpha1/skills:
    get:
      operationId: listSkills
      summary: List skills
      tags: [skills]
      description: |
        Returns the authoritative, deterministically ordered startup snapshot
        of validated skills loaded by the shared runtime. A runtime with skill
        loading disabled returns an empty list. Custom API compositions without
        any skill registry return `501 Not Implemented`.
      responses:
        "200":
          description: List of skills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSkillsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1alpha1/skills/install:
    post:
      operationId: installSkill
      summary: Install a skill
      tags: [skills]
      description: |
        Installs a skill package from a local filesystem path.
        Returns `501 Not Implemented`; dynamic installation is pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallSkillRequest"
            example:
              path: "/opt/polkagent/skills/my-skill"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Skill installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1alpha1/skills/{skill_id}:
    parameters:
      - $ref: "#/components/parameters/SkillIdPath"
    get:
      operationId: getSkill
      summary: Get a skill
      tags: [skills]
      description: |
        Returns one loaded definition from the shared runtime snapshot by
        package name. Unknown names return `404 Not Found`; custom API
        compositions without any skill registry return `501 Not Implemented`.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Skill found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1alpha1/skills/{skill_id}/uninstall:
    parameters:
      - $ref: "#/components/parameters/SkillIdPath"
    post:
      operationId: uninstallSkill
      summary: Uninstall a skill
      tags: [skills]
      description: |
        Uninstalls a skill by package name.
        Returns `501 Not Implemented`; dynamic uninstallation is pending.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Skill uninstalled.
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/skills/{skill_id}/config:
    parameters:
      - $ref: "#/components/parameters/SkillIdPath"
    put:
      operationId: updateSkillConfig
      summary: Update skill configuration
      tags: [skills]
      description: |
        Merges the provided key-value pairs into the skill's runtime
        configuration. Returns `501 Not Implemented`; per-skill config
        mutation is pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSkillConfigRequest"
            example:
              config:
                api_endpoint: "https://example.com/api"
                timeout_secs: 30
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Skill configuration updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  # ==========================================================================
  # Tools
