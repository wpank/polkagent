openapi: 3.1.0

info:
  title: Polkagent API
  version: "0.1.0"
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: |
    The Polkagent REST API provides programmatic access to the Polkagent
    platform. Resource endpoints are versioned under `/api/v1alpha1`.
    Health probes, metrics, OpenAPI discovery, and the PCA compatibility
    bridge use explicit root-level paths.

    ## Versioning

    The current version string is `v1alpha1`. Resource envelopes returned by
    the versioned REST API include a top-level `"version"` field set to this
    value. Root-level operational endpoints and pre-handler middleware errors
    use their endpoint-specific schemas instead.

    ## Pagination

    List endpoints use cursor-based pagination. Pass the `after` query
    parameter with the opaque token returned in `cursor.next` to fetch the
    next page. When `cursor.has_more` is `false` you have reached the last
    page.

    ## Access policy

    Operations inherit API-key or bearer authentication unless they declare
    `security: []`. Public probe and discovery operations also bypass the
    per-client rate limiter. Protected operations can return compact `401` or
    `429` middleware errors before a route handler runs.

    ## Handler errors

    Errors produced after a request reaches a route handler use this envelope:
    ```json
    {
      "error": {
        "code": "AGENT_NOT_FOUND",
        "message": "agent not found: <id>",
        "request_id": "<uuid>",
        "timestamp": "<iso8601>"
      }
    }
    ```

    ## Streaming

    Checkpointed durable interaction events are available over SSE at
    `GET /api/v1alpha1/interactions/{id}/events/stream`. WebSocket transports
    are documented separately because OpenAPI can describe their HTTP upgrade
    handshake, but not their bidirectional frame protocols; a handshake-only
    operation would be an incomplete contract.

servers:
  - url: /
    description: Current Polkagent deployment origin.

security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: agents
    description: Agent CRUD and lifecycle management.
  - name: runs
    description: Run creation, querying, and control.
  - name: effects
    description: Effect intent review and approval pipeline.
  - name: artifacts
    description: Artifact metadata, content download, and provenance.
  - name: events
    description: Durable event log and real-time WebSocket stream.
  - name: providers
    description: AI model provider configuration (read-only).
  - name: models
    description: Model discovery across all configured providers.
  - name: skills
    description: Skill package installation and configuration.
  - name: tools
    description: Tool registry and grant inspection.
  - name: payments
    description: Budget tracking, usage statistics, and payment receipts.
  - name: memory
    description: Semantic memory search and management.
  - name: audit
    description: Optional durable audit-log queries and integrity verification.
  - name: conversations
    description: Optional low-level transcript storage compatibility API.
  - name: registry
    description: Optional service-listing publication and discovery.
  - name: interactions
    description: Durable, idempotent agent prompting and checkpointed event replay.
  - name: system
    description: Platform version and configuration summary.
  - name: metrics
    description: Prometheus text exposition for operational telemetry.
  - name: health
    description: Liveness, readiness, and startup probes.
  - name: bridge
    description: PCA C1 bridge compatibility API for harness integrations.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------

paths:

  # ==========================================================================
  # Agents
  # ==========================================================================

  /api/v1alpha1/agents:
    post:
      operationId: createAgent
      summary: Create an agent
      tags: [agents]
      description: |
        Persists a new agent spec and returns it with `201 Created`. The
        `name` and `model` fields are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
            example:
              name: "My Assistant"
              model: "anthropic/claude-opus-4-6"
              description: "General-purpose assistant"
              tools: ["polkagent.file.read"]
              system_prompt: "You are a helpful assistant."
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listAgents
      summary: List agents
      tags: [agents]
      description: Returns a paginated list of all agents.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - name: after
          in: query
          description: Opaque cursor from the previous page (`cursor.next`).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated list of agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAgentsResponse"
        "400":
          $ref: "#/components/responses/BadQueryParameters"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentIdPath"

    get:
      operationId: getAgent
      summary: Get an agent
      tags: [agents]
      description: Returns the full spec and status for a single agent.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Agent found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteAgent
      summary: Delete an agent
      tags: [agents]
      description: Removes the agent from the registry. Returns `204 No Content`.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Agent deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/agents/{id}/start:
    parameters:
      - $ref: "#/components/parameters/AgentIdPath"
    post:
      operationId: startAgent
      summary: Start an agent
      tags: [agents]
      description: |
        Requests the agent to transition to the running state. Currently
        returns a lifecycle acknowledgement; full lifecycle wiring is pending.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Lifecycle action acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLifecycleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1alpha1/agents/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/AgentIdPath"
    post:
      operationId: stopAgent
      summary: Stop an agent
      tags: [agents]
      description: Requests the agent to halt all activity.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Lifecycle action acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLifecycleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1alpha1/agents/{id}/pause:
    parameters:
      - $ref: "#/components/parameters/AgentIdPath"
    post:
      operationId: pauseAgent
      summary: Pause an agent
      tags: [agents]
      description: Requests the agent to suspend execution without terminating.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Lifecycle action acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLifecycleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1alpha1/agents/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/AgentIdPath"
    post:
      operationId: resumeAgent
      summary: Resume an agent
      tags: [agents]
      description: Requests a paused agent to resume execution.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Lifecycle action acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLifecycleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  # ==========================================================================
  # Runs
  # ==========================================================================

  /api/v1alpha1/agents/{agent_id}/runs:
    parameters:
      - name: agent_id
        in: path
        required: true
        description: UUID of the agent to run.
        schema:
          type: string
          format: uuid
    post:
      operationId: createRun
      summary: Create a run
      tags: [runs]
      description: |
        Creates and immediately queues a run for the specified agent. The
        `input` field is an opaque JSON value interpreted by the agent.
        Provide `idempotency_key` (within a 24-hour window) to avoid
        duplicate runs on retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
            example:
              input: "Summarise the attached document."
              idempotency_key: "req-20260101-abc123"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Run created and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/runs:
    get:
      operationId: listRuns
      summary: List runs
      tags: [runs]
      description: Returns a paginated list of runs across all agents.
      parameters:
        - name: agent_id
          in: query
          description: Filter by agent UUID.
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          description: Filter by run state.
          schema:
            $ref: "#/components/schemas/RunState"
        - $ref: "#/components/parameters/LimitParam"
        - name: after
          in: query
          description: Opaque cursor from the previous page.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated list of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRunsResponse"
        "400":
          $ref: "#/components/responses/BadQueryParameters"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    get:
      operationId: getRun
      summary: Get a run
      tags: [runs]
      description: Returns full details for a single run.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Run found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    post:
      operationId: cancelRun
      summary: Cancel a run
      tags: [runs]
      description: |
        Requests cancellation of a run that is not yet in a terminal state.
        Returns `409 Conflict` if the run has already completed, failed, or
        been cancelled.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Run cancellation accepted; updated run returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/runs/{id}/turns:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    get:
      operationId: listRunTurns
      summary: List turns for a run
      tags: [runs]
      description: |
        Returns the ordered list of turns for a run. Each turn represents
        one model invocation cycle. Currently returns an empty list; turn
        persistence is pending.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: List of turn summaries (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTurnsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    get:
      operationId: listRunEvents
      summary: List events for a run
      tags: [runs]
      description: |
        Returns all durable events associated with the specified run.
        Returns `501 Not Implemented` when no event store is configured.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: List of events for the run.
          content:
            application/json:
              schema:
                type: object
                required: [version, data]
                properties:
                  version:
                    type: string
                    example: v1alpha1
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunEvent"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/runs/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    get:
      operationId: listRunArtifacts
      summary: List artifacts for a run
      tags: [runs]
      description: |
        Returns metadata for all artifacts produced during the specified run.
        Returns `501 Not Implemented` when no artifact store is configured.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: List of artifact metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListArtifactsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/runs/{id}/effects:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    get:
      operationId: listRunEffects
      summary: List effects for a run
      tags: [runs]
      description: Returns all effect intents associated with the specified run.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: List of effect intents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEffectsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/runs/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/RunIdPath"
    post:
      operationId: resumeRun
      summary: Resume a paused run
      tags: [runs]
      description: |
        Attempts to transition a run from `Paused` back to `Running`.
        Currently returns `501 Not Implemented`; pause/resume wiring is
        pending.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Run resumed; updated run returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  # ==========================================================================
  # Effects
  # ==========================================================================

  /api/v1alpha1/effects/{id}:
    parameters:
      - $ref: "#/components/parameters/EffectIdPath"
    get:
      operationId: getEffect
      summary: Get an effect
      tags: [effects]
      description: Returns the stored intent payload for a single effect.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Effect found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/effects/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/EffectIdPath"
    post:
      operationId: approveEffect
      summary: Approve an effect
      tags: [effects]
      description: |
        Approves a pending effect intent, allowing the agent to execute it.
        Returns `501 Not Implemented`; approval wiring is pending.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Effect approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/v1alpha1/effects/{id}/deny:
    parameters:
      - $ref: "#/components/parameters/EffectIdPath"
    post:
      operationId: denyEffect
      summary: Deny an effect
      tags: [effects]
      description: |
        Denies a pending effect intent, preventing the agent from executing it.
        Returns `501 Not Implemented`; denial wiring is pending.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Effect denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  # ==========================================================================
  # Artifacts
  # ==========================================================================

  /api/v1alpha1/artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactIdPath"
    get:
      operationId: getArtifact
      summary: Get artifact metadata
      tags: [artifacts]
      description: |
        Returns metadata (kind, digest, classification, provenance) for a
        single artifact. Returns `501 Not Implemented` when no artifact
        store is configured.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Artifact metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/artifacts/{id}/content:
    parameters:
      - $ref: "#/components/parameters/ArtifactIdPath"
    get:
      operationId: getArtifactContent
      summary: Download artifact content
      tags: [artifacts]
      description: |
        Downloads the raw artifact body as `application/octet-stream`.
        Returns `501 Not Implemented` when no artifact store is configured.
        Returns `500 Internal Server Error` if the content integrity check
        fails.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Raw artifact bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/artifacts/{id}/provenance:
    parameters:
      - $ref: "#/components/parameters/ArtifactIdPath"
    get:
      operationId: getArtifactProvenance
      summary: Get artifact provenance chain
      tags: [artifacts]
      description: |
        Returns the ordered lineage chain (oldest ancestor first) for an
        artifact. Currently returns a single-element chain; full provenance
        traversal is pending.
        Returns `501 Not Implemented` when no artifact store is configured.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Artifact provenance chain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvenanceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================================================
  # Events (REST)
  # ==========================================================================

  /api/v1alpha1/events:
    get:
      operationId: listEvents
      summary: List durable events
      tags: [events]
      description: |
        Queries the durable event log with optional filters and cursor-based
        pagination. Page size defaults to 50, maximum 200.
        Returns `501 Not Implemented` when no event store is configured.
      parameters:
        - name: run_id
          in: query
          description: Filter events by run UUID.
          schema:
            type: string
            format: uuid
        - name: event_type
          in: query
          description: Filter by event type string (e.g. `run_created`).
          schema:
            type: string
        - name: since
          in: query
          description: Return events with `global_sequence >= since`.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          description: Maximum items per page (default 50, max 200).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Paginated list of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEventsResponse"
        "400":
          $ref: "#/components/responses/BadQueryParameters"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Event ID (UUID string).
        schema:
          type: string
    get:
      operationId: getEvent
      summary: Get a durable event
      tags: [events]
      description: |
        Returns a single durable event by its ID.
        Returns `501 Not Implemented` when no event store is configured.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Event found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================================================
  # Providers
  # ==========================================================================

  /api/v1alpha1/providers:
    get:
      operationId: listProviders
      summary: List AI providers
      tags: [providers]
      description: |
        Returns all configured AI model providers. Secret fields (API keys)
        are never included.
      responses:
        "200":
          description: List of providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProvidersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/providers/{id}:
