      summary: Get usage statistics
      tags: [payments]
      description: |
        Returns aggregated usage statistics (run count, token totals,
        estimated cost) for the last 30 days.
        Returns `501 Not Implemented` when no payment store is configured.
      responses:
        "200":
          description: Usage statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentUsageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/payments/receipts:
    get:
      operationId: listPaymentReceipts
      summary: List payment receipts
      tags: [payments]
      description: |
        Returns all on-chain payment receipts.
        Returns `501 Not Implemented` when no payment store is configured.
      responses:
        "200":
          description: List of payment receipts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPaymentReceiptsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/payments/receipts/{receipt_id}:
    parameters:
      - name: receipt_id
        in: path
        required: true
        description: Intent ID for the receipt.
        schema:
          type: string
    get:
      operationId: getPaymentReceipt
      summary: Get a payment receipt
      tags: [payments]
      description: |
        Returns a single payment receipt by its intent ID.
        Returns `501 Not Implemented` when no payment store is configured.
        Returns `404 Not Found` when receipt lookup is not yet implemented.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Payment receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReceiptResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================================================
  # Memory
  # ==========================================================================

  /api/v1alpha1/memory/query:
    post:
      operationId: queryMemory
      summary: Search memory
      tags: [memory]
      description: |
        Queries the exact durable memory store owned by the production runtime
        and returns results in relevance order. `namespace`, when supplied,
        selects `episodic`, `semantic`, or `procedural` memory. A runtime with
        memory disabled returns an empty result. Custom API composition without
        a memory store returns `501 Not Implemented`. Because this read uses
        `POST`, server-wide read-only mode rejects it with `405` before routing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryQueryRequest"
            example:
              query: "OAuth token refresh flow"
              limit: 5
              namespace: "semantic"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Memory search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryQueryResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/memory/stats:
    get:
      operationId: getMemoryStats
      summary: Get memory statistics
      tags: [memory]
      description: |
        Returns exact aggregate statistics from the durable memory store
        already owned by the production runtime. `total_bytes` is the sum of
        UTF-8 content bytes; it does not claim SQLite file or index size.
        Observation does not update access timestamps or counters. A runtime
        with memory disabled returns zero values. Custom API composition
        without a memory store returns `501 Not Implemented`.
      responses:
        "200":
          description: Memory statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/memory/forget:
    post:
      operationId: forgetMemory
      summary: Delete memory entries
      tags: [memory]
      description: |
        Atomically deletes one or more entries by UUID from the exact durable
        memory store already owned by the production runtime. Unknown and
        duplicate IDs are idempotent and do not increment the returned count.
        Every ID is validated before mutation. A runtime with memory disabled
        returns `deleted: 0`; custom API composition without a memory store
        returns `501 Not Implemented`. Server-wide read-only mode rejects this
        mutation with `405` before routing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryForgetRequest"
            example:
              entry_ids:
                - "018f47a0-7b2c-7d91-8f0a-58ef65026f0f"
                - "018f47a0-b46a-768f-98b7-780459cd934d"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Memory entries deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryForgetResponse"
        "405":
          description: Server-wide read-only mode rejected the mutation.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: server is in read-only mode
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/memory/entries/{entry_id}:
    parameters:
      - name: entry_id
        in: path
        required: true
        description: Memory entry identifier.
        schema:
          type: string
          format: uuid
    get:
      operationId: getMemoryEntry
      summary: Get a memory entry
      tags: [memory]
      description: |
        Returns one entry through the canonical non-mutating lookup port of the
        exact durable memory store owned by the production runtime. Observation
        does not change access timestamps or counters. A runtime with memory
        disabled returns `404`; custom API composition without a memory store
        returns `501 Not Implemented`.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Memory entry found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntryResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================================================
  # Audit (optional store)
  # ==========================================================================

  /api/v1alpha1/audit:
    get:
      operationId: listAuditEntries
      summary: List durable audit entries
      tags: [audit]
      description: |
        Queries the configured audit store. Returns `501 Not Implemented` when
        the server was started without an audit store.
      parameters:
        - name: actor
          in: query
          description: Exact actor ID to match.
          schema:
            type: string
        - name: action
          in: query
          description: Audit action in snake_case (for example `run_started`).
          schema:
            type: string
        - name: since
          in: query
          description: Include entries at or after this RFC 3339 timestamp.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Include entries at or before this RFC 3339 timestamp.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Maximum entries to return (default 100).
          schema:
            type: integer
            minimum: 0
            default: 100
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Matching entries and returned count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/audit/verify:
    get:
      operationId: verifyAuditIntegrity
      summary: Verify the audit hash chain
      tags: [audit]
      description: |
        Verifies every configured audit-store entry. Returns a successful JSON
        result with `valid: false` for an integrity violation, and returns
        `501 Not Implemented` when no audit store is configured.
      responses:
        "200":
          description: Integrity verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerifyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/audit/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Audit-entry UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAuditEntry
      summary: Get a durable audit entry
      tags: [audit]
      description: Returns `501 Not Implemented` when no audit store is configured.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Audit entry found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================================================
  # Conversation transcripts (optional store; no agent execution)
  # ==========================================================================

  /api/v1alpha1/conversations:
    post:
      operationId: createConversation
      summary: Create a transcript container
      tags: [conversations]
      description: |
        Creates low-level transcript storage only. It does not start an agent
        run or durable interaction. Use `POST /interactions` and its prompt
        operation for agent execution. Returns `501 Not Implemented` when no
        conversation store is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Transcript container created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateConversationResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listConversations
      summary: List transcript containers for an agent
      tags: [conversations]
      description: Returns `501 Not Implemented` when no conversation store is configured.
      parameters:
        - name: agent_id
          in: query
          required: true
          description: Owning agent UUID.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum records to return (default 50, maximum 100).
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of records to skip.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Page of transcript summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListConversationsResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Conversation UUID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getConversation
      summary: Get a transcript and its messages
      tags: [conversations]
      description: Returns `501 Not Implemented` when no conversation store is configured.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Transcript and up to its first 100 messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteConversation
      summary: Delete a transcript and its messages
      tags: [conversations]
      description: Returns `501 Not Implemented` when no conversation store is configured.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
