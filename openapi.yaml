  # ==========================================================================
  # Durable interactions
  # ==========================================================================

  /api/v1alpha1/interactions:
    post:
      operationId: createInteraction
      summary: Create a durable interaction
      tags: [interactions]
      description: |
        Creates a durable interaction without starting execution. The target
        is resolved by the shared runtime. Provider and model configuration
        are intentionally not accepted by this HTTP surface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHttpInteractionRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Interaction created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpInteractionResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listInteractions
      summary: List durable interactions
      tags: [interactions]
      parameters:
        - name: limit
          in: query
          description: Maximum summaries to return (default 50, max 100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of summaries to skip in stable recency order.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: state
          in: query
          description: Optional interaction lifecycle filter.
          schema:
            $ref: "#/components/schemas/InteractionState"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Page of durable interactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHttpInteractionsResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/interactions/{id}:
    parameters:
      - $ref: "#/components/parameters/InteractionIdPath"

    get:
      operationId: getInteraction
      summary: Get a durable interaction
      tags: [interactions]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Durable interaction projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpInteractionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: archiveInteraction
      summary: Archive a terminal interaction
      tags: [interactions]
      description: |
        Marks the interaction archived while retaining its transcript, turns,
        and events. An interaction with active work cannot be archived.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "204":
          description: Interaction archived; no response body.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/interactions/{id}/turns:
    parameters:
      - $ref: "#/components/parameters/InteractionIdPath"

    get:
      operationId: listInteractionTurns
      summary: List durable interaction turns
      tags: [interactions]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Turns in monotonic ordinal order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHttpInteractionTurnsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/interactions/{id}/prompt:
    parameters:
      - $ref: "#/components/parameters/InteractionIdPath"

    post:
      operationId: promptInteraction
      summary: Start an idempotent interaction turn
      tags: [interactions]
      description: |
        Durably commits the user message, caller correlation, run link, and
        initial event before execution begins. Supplying `turn_id` makes the
        call idempotent: identical retries return the original handle, while
        different input with the same ID returns `409 Conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptHttpInteractionRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "202":
          description: Turn is durable and execution has been accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptHttpInteractionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/interactions/{id}/turns/{turn_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/InteractionIdPath"
      - $ref: "#/components/parameters/InteractionTurnIdPath"

    post:
      operationId: cancelInteractionTurn
      summary: Cancel an interaction turn
      tags: [interactions]
      description: |
        Verifies that the turn belongs to the path interaction, then requests
        cancellation through the shared interaction service. Repeated
        cancellation of a terminal turn is idempotent.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Current cancelled or terminal turn projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelHttpInteractionTurnResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/interactions/{id}/config:
    parameters:
      - $ref: "#/components/parameters/InteractionIdPath"

    get:
      operationId: getInteractionConfig
      summary: Read supported durable interaction configuration
      tags: [interactions]
      description: |
        Returns only the target and model options supported by the shared
        runtime. The model is `null` when execution inherits the selected
        agent's registered model.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Effective supported durable configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpInteractionConfigResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: updateInteractionConfig
      summary: Atomically update target or model configuration
      tags: [interactions]
      description: |
        Validates and durably replaces exactly one tagged option before
        returning the effective configuration. `{"option":"model","value":
        null}` clears the model override. Unknown targets or models fail
        without changing the interaction or creating a run or turn.

        Only `target` and `model` are accepted. Provider, harness, autonomy,
        maximum-turn, and budget options are rejected rather than ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHttpInteractionConfigRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Effective supported durable configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpInteractionConfigResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/interactions/{id}/target:
    parameters:
      - $ref: "#/components/parameters/InteractionIdPath"

    put:
      operationId: updateInteractionTarget
      summary: Update an interaction target (compatibility)
      tags: [interactions]
      deprecated: true
      description: |
        Compatibility delegate for clients using the original target-only
        route. It performs the same strict validation and atomic durable
        service mutation as the tagged `PUT /interactions/{id}/config` target
        variant. New clients should use the general configuration route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHttpInteractionTargetRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Full effective interaction configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateHttpInteractionTargetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/interactions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/InteractionIdPath"

    get:
      operationId: replayInteractionEvents
      summary: Replay durable interaction events
      tags: [interactions]
      description: |
        Returns a finite, ordered JSON page after a durable per-interaction
        sequence. Persist `checkpoint.next_after_sequence` and pass it as the
        next `after_sequence`. A `turn_id` filter scans across unrelated turns
        without skipping matching events. This is replay, not a live SSE or
        WebSocket interaction stream.
      parameters:
        - name: after_sequence
          in: query
          description: Return events strictly after this durable sequence.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: turn_id
          in: query
          description: Optional turn filter; sequences remain interaction-wide.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum matching events to return (default 100, max 999).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 999
            default: 100
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Ordered finite replay page and durable checkpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayInteractionEventsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/interactions/{id}/events/stream:
    parameters:
      - $ref: "#/components/parameters/InteractionIdPath"

    get:
      operationId: streamInteractionEvents
      summary: Replay and follow durable interaction events over SSE
      tags: [interactions]
      description: |
        Attaches to the exact bounded stream owned by the shared interaction
        service, replays durable events after the selected checkpoint, then
        follows live events. A valid `Last-Event-ID` header takes precedence
        over the `after_sequence` query parameter. Every data event is named
        `interaction_event`; its `id` is the durable interaction-wide sequence
        and its JSON `data` is an `InteractionEventEnvelope`. Safe comment-only
        keepalives may appear between data events.

        On live-channel lag, the server resubscribes after the last sequence it
        actually emitted, preventing duplicate or skipped data events. A turn
        filter can therefore produce non-contiguous IDs. Terminal turn events
        do not close the interaction stream because later turns may follow.

        The service attaches its bounded live receiver before replay, then
        loads durable history lazily in bounded pages as the client consumes
        the stream. Old-checkpoint reconnects therefore avoid materializing the
        full backlog, and an early disconnect stops later replay reads.
      parameters:
        - name: after_sequence
          in: query
          description: Used only when `Last-Event-ID` is absent.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: turn_id
          in: query
          description: Optional turn filter; event IDs remain interaction-wide.
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          description: |
            Non-negative durable sequence already processed by the client.
            When present and valid, this header overrides `after_sequence`.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: |
            Open SSE connection. Each `interaction_event` data field is a
            JSON-encoded `InteractionEventEnvelope` and each ID is its sequence.
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE wire stream of typed interaction envelopes."
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/PermissionDenied"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================================================
  # System
  # ==========================================================================

  /api/v1alpha1/system/info:
    get:
      operationId: getSystemInfo
      summary: Get system info
      tags: [system]
      description: |
        Returns platform version, process uptime, and a non-secret
        configuration summary. No secrets, API keys, or database URLs
        are included.
      responses:
        "200":
          description: System information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfoResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /metrics:
    get:
      operationId: getPrometheusMetrics
      summary: Export Prometheus metrics
      tags: [metrics]
      description: |
        Renders all registered metric families in Prometheus text format.
        This operational endpoint is authenticated and rate-limited because
        metrics can reveal deployment and workload details.
      responses:
        "200":
          description: Prometheus text exposition, version 0.0.4.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /openapi.json:
    get:
      operationId: getOpenApiSpec
      summary: Get OpenAPI specification
      tags: [system]
      description: |
        Returns this OpenAPI specification as a JSON document. This discovery
        endpoint is public and is not rate-limited.
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 specification in JSON format.
          content:
            application/json:
              schema:
                type: object
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================================================
  # Health (no version prefix)
  # ==========================================================================

  /health/live:
    get:
      operationId: healthLive
      summary: Liveness probe
      tags: [health]
      security: []
      description: |
        Always returns `200 OK` with `{"status": "ok"}`. If this endpoint
        fails the process should be considered dead.
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLivenessResponse"

  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness probe
      tags: [health]
      security: []
      description: |
        Returns `200 OK` after startup when no tracked critical component is
        in an error state. Returns `503 Service Unavailable` before startup
        completes or when a tracked critical component reports an error.
      responses:
        "200":
          description: Server is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadinessResponse"
        "503":
          description: Startup is incomplete or a tracked component is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadinessResponse"

  /health/startup:
    get:
      operationId: healthStartup
      summary: Startup probe
      tags: [health]
      security: []
      description: |
        Returns `200 OK` once one-time initialisation (configuration loading,
        migrations, registry warm-up) has completed. Kubernetes can delay
        liveness/readiness checks until this returns 200.
      responses:
        "200":
          description: Initialisation complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStartupResponse"
        "503":
          description: Initialisation is still in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStartupResponse"

  # ==========================================================================
  # PCA C1 Bridge (PRD-06)
  # ==========================================================================

  /v1/compat/pca/health:
    get:
      operationId: bridgeHealth
      summary: Bridge health status
      tags: [bridge]
      security: []
      description: |
        Returns identity, transport connectivity, and supported capabilities
        so that PCA clients can discover what the bridge instance supports.
      responses:
        "200":
          description: Bridge health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeHealthResponse"

  /v1/compat/pca/inbound:
    get:
      operationId: bridgeInbound
      summary: Poll inbound deliveries
      tags: [bridge]
      description: |
        Long-poll for pending inbound deliveries. Each delivery includes a
        lease that must be ACKed or renewed before it expires. Unlike bridge
        health discovery, the PCA data plane is authenticated and rate-limited.
      responses:
        "200":
          description: Zero or more pending deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeInboundResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/compat/pca/inbound/ack:
    post:
      operationId: bridgeAck
      summary: Acknowledge a delivery
      tags: [bridge]
      description: |
        Confirm that the harness has safely processed a delivery. The
        delivery_id and lease_id must match an active lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeAckRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Delivery acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeAckResponse"
        "422":
          description: Missing or invalid delivery_id / lease_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/compat/pca/inbound/renew:
    post:
      operationId: bridgeRenew
      summary: Renew a delivery lease
      tags: [bridge]
      description: |
        Extend the lease on a delivery that is still being processed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeRenewRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Lease renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeRenewResponse"
        "422":
          description: Missing or invalid delivery_id / lease_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/compat/pca/send:
    post:
      operationId: bridgeSend
      summary: Send a reply through the bridge
      tags: [bridge]
      description: |
        Deliver a response back to the chat via the bridge. The message is
        routed to the appropriate transport for outbound delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeSendRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Message sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeSendResponse"
        "422":
          description: Missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------

components:

  # --------------------------------------------------------------------------
  # Security schemes
  # --------------------------------------------------------------------------

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authenticating requests to the Polkagent API.
    BearerAuth:
      type: http
      scheme: bearer
      description: API key supplied as an Authorization bearer token.

  # --------------------------------------------------------------------------
  # Reusable parameters
  # --------------------------------------------------------------------------

  parameters:

    AgentIdPath:
      name: id
      in: path
      required: true
      description: UUID of the agent.
      schema:
        type: string
        format: uuid

    RunIdPath:
      name: id
      in: path
      required: true
      description: UUID of the run.
      schema:
        type: string
        format: uuid

    EffectIdPath:
      name: id
      in: path
      required: true
      description: UUID of the effect intent.
      schema:
        type: string
        format: uuid

    ArtifactIdPath:
      name: id
      in: path
      required: true
      description: UUID of the artifact.
      schema:
        type: string
        format: uuid

    InteractionIdPath:
      name: id
      in: path
      required: true
      description: Conversation UUID that is also the durable interaction ID.
      schema:
        type: string
        format: uuid

    InteractionTurnIdPath:
      name: turn_id
      in: path
      required: true
      description: Caller- or server-generated durable interaction turn UUID.
      schema:
        type: string
        format: uuid

    SkillIdPath:
      name: skill_id
      in: path
      required: true
      description: Skill package name (e.g. `my-skill`).
      schema:
        type: string

    ToolIdPath:
      name: tool_id
      in: path
      required: true
      description: Tool name (e.g. `polkagent.file.read`).
      schema:
        type: string

    LimitParam:
      name: limit
      in: query
      description: Maximum items per page (default 50, max 100).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50

  # --------------------------------------------------------------------------
  # Reusable responses
  # --------------------------------------------------------------------------

  responses:

    BadQueryParameters:
      description: Query-string deserialization failed before the handler ran.
      content:
        text/plain:
          schema:
            type: string

    Unauthorized:
      description: Authentication is enabled and credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthMiddlewareErrorResponse"
          examples:
            missingCredentials:
              value:
                error:
                  code: UNAUTHORIZED
                  message: missing credentials
            invalidApiKey:
              value:
                error:
                  code: UNAUTHORIZED
                  message: invalid API key

    RateLimited:
      description: The protected request exceeded its per-client token bucket.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying (minimum one).
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Limit:
          description: Configured token-bucket burst capacity.
          schema:
            type: integer
            minimum: 1
        X-RateLimit-Remaining:
          description: Remaining tokens; always zero on this response.
          schema:
            type: integer
            const: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitMiddlewareErrorResponse"
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: too many requests
              retry_after: 1

    ValidationError:
      description: Request body or query parameters failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: "name must not be empty"
              request_id: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e8"
              timestamp: "2026-07-31T12:00:00Z"

    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: "agent not found: 0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e8"
              request_id: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e9"
              timestamp: "2026-07-31T12:00:00Z"

    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_STATE
              message: "run is already in a terminal state"
              request_id: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6ea"
              timestamp: "2026-07-31T12:00:00Z"

    NotImplemented:
      description: The endpoint exists but is not yet implemented.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_IMPLEMENTED
              message: "skill installation is not yet implemented"
              request_id: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6eb"
              timestamp: "2026-07-31T12:00:00Z"

    PermissionDenied:
      description: The authenticated caller is not permitted to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PERMISSION_DENIED
              message: "permission denied: interaction operation is not authorized"
              request_id: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6ed"
              timestamp: "2026-07-31T12:00:00Z"

    Unavailable:
      description: A composed runtime dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAVAILABLE
              message: "unavailable: interaction execution is temporarily unavailable"
              request_id: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6ee"
              timestamp: "2026-07-31T12:00:00Z"

    InternalError:
      description: An unexpected internal server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: "internal error: database connection lost"
              request_id: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6ec"
              timestamp: "2026-07-31T12:00:00Z"

  # --------------------------------------------------------------------------
  # Schemas
  # --------------------------------------------------------------------------

  schemas:

    AuthMiddlewareErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      description: Compact error emitted before a request reaches a route handler.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              const: UNAUTHORIZED
            message:
              type: string
              enum: [missing credentials, invalid API key]

    RateLimitMiddlewareErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      description: Compact error emitted before a request reaches a route handler.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retry_after]
          properties:
            code:
              type: string
              const: RATE_LIMIT_EXCEEDED
            message:
              type: string
              const: too many requests
            retry_after:
              type: integer
              format: int64
              minimum: 1

    # ---- Enums ---------------------------------------------------------------

    AgentState:
      type: string
      description: Operational state of an agent.
      enum:
        - Created
        - Starting
        - Running
        - Pausing
        - Paused
        - Stopping
        - Stopped
        - Error
      example: Created

    RunState:
      type: string
      description: Lifecycle state of a run.
      enum:
        - Queued
        - Running
        - Paused
        - Completed
        - Failed
        - Cancelled
      example: Running

    EventKind:
      type: string
      description: |
        Discriminator for `RunEvent` payloads. Corresponds to the
        `EventKind` enum in `polkagent-core`.
      enum:
        - RunCreated
        - RunQueued
        - RunStarted
        - RunCompleted
        - RunFailed
        - RunCancelled
        - TurnStarted
        - TurnCompleted
        - ToolCallStarted
        - ToolCallCompleted
        - EffectRequested
        - EffectApproved
        - EffectDenied
        - EffectExecuted
        - ArtifactProduced
        - AgentMessage
      example: RunCreated

    # ---- Pagination ----------------------------------------------------------

    CursorInfo:
      type: object
      required: [has_more]
      description: Cursor state included in every list response.
      properties:
        next:
          type: [string, "null"]
          description: Opaque token for the next page, or null on the last page.
          example: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e8"
        has_more:
          type: boolean
          description: True when more items exist beyond this page.
          example: true

    PageMeta:
      type: object
      required: [page_size]
      description: Metadata about the current response page.
      properties:
        page_size:
          type: integer
          description: Number of items in this response.
          example: 50

    # ---- Audit ---------------------------------------------------------------

    AuditEntry:
      type: object
      description: |
        Append-only audit record serialized by the audit subsystem. The action
        and actor payloads vary by audited operation; the stable envelope fields
        are listed here and subsystem-specific object fields remain extensible.
      required: [id, timestamp, actor, action, resource, outcome, context, integrity_hash]
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        actor:
          type: object
          additionalProperties: true
        action:
          description: Snake-case audit action discriminator.
        resource:
          type: object
          required: [resource_type, resource_id]
          properties:
            resource_type:
              type: string
            resource_id:
              type: string
            description:
              type: [string, "null"]
        outcome:
          type: string
          enum: [success, failure, denied, error]
        context:
          description: Arbitrary JSON context captured with the action.
        integrity_hash:
          type: string

    AuditEntryResponse:
      type: object
      required: [version, data]
      properties:
        version:
          type: string
          const: v1alpha1
        data:
          $ref: "#/components/schemas/AuditEntry"

    AuditListResponse:
      type: object
      required: [version, data, count]
      properties:
        version:
          type: string
          const: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        count:
          type: integer
          minimum: 0

    AuditVerifyResponse:
      type: object
      required: [version, valid, entries_checked]
      properties:
        version:
          type: string
          const: v1alpha1
        valid:
          type: boolean
        entries_checked:
          type: integer
          minimum: 0
        error:
          type: string
          description: First integrity error; omitted when the chain is valid.

    # ---- Conversation transcripts -------------------------------------------

    CreateConversationRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
          format: uuid
        title:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    CreateConversationResponse:
      type: object
      required: [version, id, agent_id, created_at]
      properties:
        version:
          type: string
          const: v1alpha1
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time

    ConversationSummary:
      type: object
      required: [id, agent_id, message_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        title:
          type: string
        message_count:
          type: integer
          format: int32
          minimum: 0
        last_message_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ListConversationsResponse:
      type: object
      required: [version, data, cursor, meta]
      properties:
        version:
          type: string
          const: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        cursor:
          $ref: "#/components/schemas/CursorInfo"
        meta:
          $ref: "#/components/schemas/PageMeta"

    ConversationMessage:
      type: object
      required: [id, conversation_id, role, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        created_at:
          type: string
          format: date-time
        token_count:
          type: integer
          format: int32
          minimum: 0

    ConversationResponse:
      type: object
      required: [version, id, agent_id, message_count, created_at, updated_at, messages]
      properties:
        version:
          type: string
          const: v1alpha1
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        title:
          type: string
        message_count:
          type: integer
          format: int32
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"

    CreateMessageRequest:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string

    CreateMessageResponse:
      type: object
      required: [version, id, conversation_id, role, content, created_at]
      properties:
        version:
          type: string
          const: v1alpha1
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        created_at:
          type: string
          format: date-time

    # ---- Service registry ----------------------------------------------------

    ServicePricing:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: Pricing model such as free, usage_metered, subscription, or one_time.
        unit:
          type: string
        price:
          type: string
          description: Decimal price encoded as a string.
        currency:
          type: string

    CreateServiceListingRequest:
      type: object
      required: [name, description, author, version, pricing]
      properties:
        name:
          type: string
        description:
          type: string
        author:
          type: string
        version:
          type: string
        capabilities:
          type: array
          default: []
          items:
            type: string
        tags:
          type: array
          default: []
          items:
            type: string
        pricing:
          $ref: "#/components/schemas/ServicePricing"
        availability:
          type: string
          default: available
          enum: [available, maintenance, deprecated, offline]
        protocols:
          type: array
          default: []
          items:
            type: string
        sla_tier:
          type: string
        api_schema:
          description: API schema URL or inline JSON schema.

    ServiceListingResponse:
      type: object
      required:
        - version
        - id
        - name
        - description
        - author
        - service_version
        - capabilities
        - tags
        - pricing
        - availability
        - protocols
        - created_at
        - updated_at
      properties:
        version:
          type: string
          const: v1alpha1
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        author:
          type: string
        service_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        pricing:
          $ref: "#/components/schemas/ServicePricing"
        availability:
          type: string
          enum: [available, maintenance, deprecated, offline]
        protocols:
          type: array
          items:
            type: string
        sla_tier:
          type: string
        api_schema:
          description: API schema URL or inline JSON schema.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListServiceListingsResponse:
      type: object
      required: [version, data]
      properties:
        version:
          type: string
          const: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServiceListingResponse"

    # ---- Errors --------------------------------------------------------------

    ErrorDetail:
      type: object
      required: [code, message, request_id, timestamp]
      description: Structured error detail included in every non-2xx response.
      properties:
        code:
          type: string
          description: Machine-readable error code in SCREAMING_SNAKE_CASE.
          enum:
            - AGENT_NOT_FOUND
            - RUN_NOT_FOUND
            - NOT_FOUND
            - INVALID_STATE
            - VALIDATION_ERROR
            - INTERNAL_ERROR
            - NOT_IMPLEMENTED
            - PERMISSION_DENIED
            - UNAVAILABLE
          example: AGENT_NOT_FOUND
        message:
          type: string
          description: Human-readable explanation safe to surface to clients.
          example: "agent not found: 0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e8"
        request_id:
          type: string
          format: uuid
          description: Server-generated correlation ID for this request.
          example: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e9"
        timestamp:
          type: string
          format: date-time
          description: UTC timestamp of the error.
          example: "2026-07-31T12:00:00Z"

    ErrorResponse:
      type: object
      required: [error]
      description: Standard error envelope returned by API route handlers.
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    # ---- Health --------------------------------------------------------------

    HealthLivenessResponse:
      type: object
      required: [status]
      additionalProperties: false
      description: Stateless liveness response.
      properties:
        status:
          type: string
          const: ok

    HealthReadinessResponse:
      type: object
      required: [status, ready, checks]
      additionalProperties: false
      description: Readiness result and the critical component snapshot.
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        ready:
          type: boolean
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ComponentHealth"

    HealthStartupResponse:
      type: object
      required: [status, detail]
      additionalProperties: false
      description: One-time initialization status.
      properties:
        status:
          type: string
          enum: [ok, starting]
        detail:
          type: string
          enum: [initialisation complete, initialisation in progress]

    ComponentHealth:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, degraded, error]
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        message:
          type: string

    # ---- Agents --------------------------------------------------------------

    AgentSpec:
      type: object
      required: [id, name, model, tools, created_at, updated_at]
      description: Persisted agent specification.
      properties:
        id:
          type: string
          format: uuid
          description: Unique agent identifier.
          example: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e8"
        name:
          type: string
          description: Human-readable display name.
          example: "My Assistant"
        model:
          type: string
          description: 'Model identifier in "provider/model-id" format.'
          example: "anthropic/claude-opus-4-6"
        description:
          type: [string, "null"]
          description: Optional description shown in UIs and logs.
          example: "General-purpose assistant"
        tools:
          type: array
          items:
            type: string
          description: Names of tools the agent may invoke.
          example: ["polkagent.file.read"]
        system_prompt:
          type: [string, "null"]
          description: System prompt template.
          example: "You are a helpful assistant."
        created_at:
          type: string
          format: date-time
          description: When the agent was first created.
        updated_at:
          type: string
          format: date-time
          description: When the agent spec was last updated.

    CreateAgentRequest:
      type: object
      required: [name, model]
      description: Request body for creating a new agent.
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable name (must not be blank).
          example: "My Assistant"
        model:
          type: string
          minLength: 1
          description: 'Model identifier in "provider/model-id" format.'
          example: "anthropic/claude-opus-4-6"
        description:
          type: [string, "null"]
          description: Optional description.
          example: "General-purpose assistant"
        tools:
          type: array
          items:
            type: string
          default: []
          description: Names of tools the agent may invoke.
          example: ["polkagent.file.read"]
        system_prompt:
          type: [string, "null"]
          description: System prompt template.
          example: "You are a helpful assistant."

    AgentResponse:
      type: object
      required: [version, id, spec, status, created_at, updated_at]
      description: Full agent representation returned by the API.
      properties:
        version:
          type: string
          description: API version string.
          example: v1alpha1
        id:
          type: string
          format: uuid
          description: Unique agent identifier.
          example: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e8"
        spec:
          $ref: "#/components/schemas/AgentSpec"
        status:
          $ref: "#/components/schemas/AgentState"
        created_at:
          type: string
          format: date-time
          description: When the agent was first created.
        updated_at:
          type: string
          format: date-time
          description: When the agent spec was last updated.

    ListAgentsResponse:
      type: object
      required: [version, data, cursor, meta]
      description: Paginated list of agents.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentResponse"
        cursor:
          $ref: "#/components/schemas/CursorInfo"
        meta:
          $ref: "#/components/schemas/PageMeta"

    AgentLifecycleResponse:
      type: object
      required: [version, agent_id, action, status]
      description: Acknowledgement response for agent lifecycle actions.
      properties:
        version:
          type: string
          example: v1alpha1
        agent_id:
          type: string
          format: uuid
          description: The agent that received the lifecycle request.
          example: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e8"
        action:
          type: string
          description: The requested action (start, stop, pause, resume).
          enum: [start, stop, pause, resume]
          example: start
        status:
          type: string
          description: Outcome of the lifecycle request.
          example: not_implemented

    # ---- Runs ----------------------------------------------------------------

    CreateRunRequest:
      type: object
      required: [input]
      description: Request body for creating a new run.
      properties:
        input:
          description: |
            Opaque JSON input for the run. Different agent types may define
            their own input schemas; the API treats this as a free-form
            JSON value.
          example: "Summarise the attached document."
        idempotency_key:
          type: [string, "null"]
          description: |
            Optional idempotency key (24-hour window). Supplying the same
            key within the window returns the existing run instead of
            creating a duplicate.
          example: "req-20260101-abc123"

    RunResponse:
      type: object
      required: [version, id, agent_id, status, input, turns_completed, created_at]
      description: Full run representation returned by the API.
      properties:
        version:
          type: string
          example: v1alpha1
        id:
          type: string
          format: uuid
          description: Unique run identifier.
          example: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e8"
        agent_id:
          type: string
          format: uuid
          description: UUID of the agent that owns this run.
          example: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e7"
        status:
          $ref: "#/components/schemas/RunState"
        input:
          description: The input supplied when the run was created.
          example: "Summarise the attached document."
        turns_completed:
          type: integer
          format: int32
          description: Number of model invocation turns completed so far.
          example: 3
        created_at:
          type: string
          format: date-time
          description: When the run was created.
        started_at:
          type: [string, "null"]
          format: date-time
          description: When the run began executing.
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the run reached a terminal state.
        terminal_reason:
          type: [string, "null"]
          description: Human-readable reason for the terminal state.
          example: "Completed successfully"

    ListRunsResponse:
      type: object
      required: [version, data, cursor, meta]
      description: Paginated list of runs.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/RunResponse"
        cursor:
          $ref: "#/components/schemas/CursorInfo"
        meta:
          $ref: "#/components/schemas/PageMeta"

    TurnSummary:
      type: object
      required: [sequence, started_at]
      description: Summary of a single model invocation turn within a run.
      properties:
        sequence:
          type: integer
          format: int32
          description: Turn sequence number (1-indexed within the run).
          example: 1
        started_at:
          type: string
          format: date-time
          description: When the turn started.
        completed_at:
          type: [string, "null"]
          format: date-time
          description: When the turn completed.

    ListTurnsResponse:
      type: object
      required: [version, data]
      description: List of turn summaries for a run.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/TurnSummary"

    # ---- Effects -------------------------------------------------------------

    EffectResponse:
      type: object
      required: [version, data]
      description: A single stored effect intent.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: object
          description: |
            Raw effect intent payload as stored in the effect store.
            The schema varies by effect kind.

    ListEffectsResponse:
      type: object
      required: [version, data]
      description: List of stored effect intents.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            type: object
            description: Raw effect intent payload.

    # ---- Artifacts -----------------------------------------------------------

    ArtifactResponse:
      type: object
      required: [version, id, kind, algorithm, digest_hex, classification, created_at]
      description: Metadata for a stored artifact.
      properties:
        version:
          type: string
          example: v1alpha1
        id:
          type: string
          description: Unique artifact identifier.
          example: "01j1abc123def456"
        kind:
          type: string
          description: Artifact kind tag (e.g. "file", "code", "report").
          example: file
        algorithm:
          type: string
          description: Content-hash algorithm (e.g. "blake3").
          example: blake3
        digest_hex:
          type: string
          description: Hex-encoded content digest.
          example: "a1b2c3d4e5f6..."
        classification:
          type: string
          description: Data classification (e.g. "public", "private").
          example: private
        run_id:
          type: [string, "null"]
          format: uuid
          description: The run that produced this artifact, if any.
        created_at:
          type: string
          format: date-time
          description: When the artifact was created (ISO 8601).

    ListArtifactsResponse:
      type: object
      required: [version, data]
      description: List of artifact metadata objects.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactResponse"

    ProvenanceResponse:
      type: object
      required: [version, chain]
      description: Artifact provenance (lineage) chain.
      properties:
        version:
          type: string
          example: v1alpha1
        chain:
          type: array
          description: Ordered lineage chain, oldest ancestor first.
          items:
            $ref: "#/components/schemas/ArtifactResponse"

    # ---- Events --------------------------------------------------------------

    RunEvent:
      type: object
      required: [id, run_id, global_sequence, kind, correlation]
      description: A durable event record emitted during a run.
      properties:
        id:
          type: string
          description: Unique event identifier (UUID string).
          example: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e8"
        run_id:
          type: string
          format: uuid
          description: Run this event belongs to.
          example: "0196b2f4-3d3a-7b2a-a4c1-0da7b3c5f6e7"
        global_sequence:
          type: integer
          format: int64
          description: Monotonically increasing global sequence number.
          example: 42
        kind:
          $ref: "#/components/schemas/EventKind"
        correlation:
          type: object
          description: Correlation context for distributed tracing.
          properties:
            run_id:
              type: string
              format: uuid
            trace_id:
              type: [string, "null"]
            span_id:
              type: [string, "null"]
        payload:
          type: [object, "null"]
          description: Event-kind-specific payload (schema varies by kind).

    EventResponse:
      type: object
      required: [version, data]
      description: A single durable event retrieved from the store.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          $ref: "#/components/schemas/RunEvent"

    ListEventsResponse:
      type: object
      required: [version, data, cursor, meta]
      description: Paginated list of durable events.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/RunEvent"
        cursor:
          $ref: "#/components/schemas/CursorInfo"
        meta:
          $ref: "#/components/schemas/PageMeta"

    # ---- Providers -----------------------------------------------------------

    ProviderResponse:
      type: object
      required: [version, id, provider_type, base_url, default_model, timeout_secs, max_retries]
      description: Configuration details for an AI model provider (no secrets).
      properties:
        version:
          type: string
          example: v1alpha1
        id:
          type: string
          description: Stable provider identifier.
          example: anthropic
        provider_type:
          type: string
          description: Provider type discriminator.
          enum: [anthropic, openai_compatible, openai]
          example: anthropic
        base_url:
          type: string
          format: uri
          description: Base URL for the provider API.
          example: "https://api.anthropic.com"
        default_model:
          type: string
          description: Default model used when none is specified.
          example: "claude-opus-4-6"
        timeout_secs:
          type: integer
          format: int64
          description: Per-request timeout in seconds.
          example: 120
        max_retries:
          type: integer
          format: int32
          description: Maximum automatic retries on transient failures.
          example: 3

    ListProvidersResponse:
      type: object
      required: [version, data]
      description: List of configured AI providers.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProviderResponse"

    # ---- Models --------------------------------------------------------------

    ModelCapabilities:
      type: object
      required: [vision, tool_use, streaming]
      description: Capability flags for an AI model.
      properties:
        vision:
          type: boolean
          description: Whether the model accepts image/vision input.
          example: true
        tool_use:
          type: boolean
          description: Whether the model supports function/tool calling.
          example: true
        streaming:
          type: boolean
          description: Whether the model supports streaming responses.
          example: true

    ModelResponse:
      type: object
      required: [version, id, name, provider, context_window, capabilities]
      description: Metadata for a single AI model.
      properties:
        version:
          type: string
          example: v1alpha1
        id:
          type: string
          description: Unique model identifier.
          example: "claude-opus-4-6"
        name:
          type: string
          description: Human-readable display name.
          example: "claude-opus-4-6"
        provider:
          type: string
          description: Provider that hosts this model.
          example: anthropic
        context_window:
          type: integer
          format: int32
          description: Maximum context window in tokens.
          example: 200000
        capabilities:
          $ref: "#/components/schemas/ModelCapabilities"

    ListModelsResponse:
      type: object
      required: [version, data]
      description: List of AI models.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelResponse"

    # ---- Skills --------------------------------------------------------------

    InstallSkillRequest:
      type: object
      required: [path]
      description: Request body for installing a skill from the local filesystem.
      properties:
        path:
          type: string
          description: Filesystem path to the skill package directory.
          example: "/opt/polkagent/skills/my-skill"

    UpdateSkillConfigRequest:
      type: object
      required: [config]
      description: Request body for updating a skill's runtime configuration.
      properties:
        config:
          type: object
          description: |
            Key-value pairs to merge into the skill's configuration.
            The schema is skill-specific.
          example:
            api_endpoint: "https://example.com/api"
            timeout_secs: 30

    SkillResponse:
      type: object
      required: [version, id, name, skill_version, description, required_grants, tools, active]
      description: Metadata for a loaded skill.
      properties:
        version:
          type: string
          example: v1alpha1
        id:
          type: string
          description: Unique skill identifier in "name@version" format.
          example: "my-skill@1.0.0"
        name:
          type: string
          description: Skill package name.
          example: "my-skill"
        skill_version:
          type: string
          description: Semver version string.
          example: "1.0.0"
        description:
          type: string
          description: Human-readable description.
          example: "Provides file system access tools."
        required_grants:
          type: array
          items:
            type: string
          description: Grant patterns required by this skill.
          example: ["polkagent.file.*"]
        tools:
          type: array
          items:
            type: string
          description: Tool names registered by this skill.
          example: ["polkagent.file.read", "polkagent.file.write"]
        active:
          type: boolean
          description: Whether the skill is currently active.
          example: true

    ListSkillsResponse:
      type: object
      required: [version, data]
      description: List of loaded skills.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/SkillResponse"

    # ---- Tools ---------------------------------------------------------------

    ToolResponse:
      type: object
      required: [version, id, description, input_schema, output_classification]
      description: Definition and metadata for a registered tool.
      properties:
        version:
          type: string
          example: v1alpha1
        id:
          type: string
          description: Unique tool name (e.g. "polkagent.file.read").
          example: "polkagent.file.read"
        description:
          type: string
          description: Human-readable description of the tool's purpose.
          example: "Read a file from the local filesystem."
        input_schema:
          type: object
          description: JSON Schema (draft 7) describing the tool's input parameters.
          example:
            type: object
            properties:
              path:
                type: string
                description: Absolute path to the file.
            required: [path]
        required_grant:
          type: [string, "null"]
          description: Grant pattern required to invoke this tool.
          example: "polkagent.file.read"
        output_classification:
          type: string
          description: Data classification of the tool's output.
          example: "Private"

    ListToolsResponse:
      type: object
      required: [version, data]
      description: List of registered tools.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/ToolResponse"

    ToolGrantsResponse:
      type: object
      required: [version, tool_id]
      description: Grant requirements for a single tool.
      properties:
        version:
          type: string
          example: v1alpha1
        tool_id:
          type: string
          description: The tool name.
          example: "polkagent.file.read"
        required_grant:
          type: [string, "null"]
          description: Required grant pattern, or null if the tool requires no grants.
          example: "polkagent.file.read"

    # ---- Payments ------------------------------------------------------------

    PaymentBalanceResponse:
      type: object
      required: [version, balance, budget]
      description: Current agent budget and available balance.
      properties:
        version:
          type: string
          example: v1alpha1
        balance:
          type: object
          description: Available balance information (structure is implementation-defined).
          example:
            available: null
            currency: NATIVE
            note: "balance tracking not yet implemented"
        budget:
          type: object
          description: Budget configuration (structure is implementation-defined).
          example:
            configured: false

    PaymentUsageResponse:
      type: object
      required: [version, total_runs, total_tokens, estimated_usd, period_start, period_end]
      description: Aggregated usage statistics for a billing period.
      properties:
        version:
          type: string
          example: v1alpha1
        total_runs:
          type: integer
          format: int64
          description: Total number of runs in this period.
          example: 42
        total_tokens:
          type: integer
          format: int64
          description: Total tokens consumed across all runs.
          example: 1250000
        estimated_usd:
          type: number
          format: double
          description: Estimated USD cost for this period.
          example: 18.75
        period_start:
          type: string
          format: date-time
          description: Start of the reporting period (ISO 8601).
        period_end:
          type: string
          format: date-time
          description: End of the reporting period (ISO 8601).

    PaymentReceiptResponse:
      type: object
      required: [version, intent_id, tx_hash, block_number, fee_paid, confirmed_at]
      description: An on-chain payment receipt.
      properties:
        version:
          type: string
          example: v1alpha1
        intent_id:
          type: string
          description: The payment intent ID fulfilled by this receipt.
          example: "intent_0196b2f4"
        tx_hash:
          type: string
          description: On-chain transaction hash.
          example: "0xabc123..."
        block_number:
          type: integer
          format: int64
          description: Block number at which the transaction was confirmed.
          example: 18500000
        fee_paid:
          type: string
          description: Fee paid expressed as a human-readable string.
          example: "0.001 ETH"
        confirmed_at:
          type: string
          format: date-time
          description: When the on-chain confirmation was observed.

    ListPaymentReceiptsResponse:
      type: object
      required: [version, data]
      description: List of payment receipts.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentReceiptResponse"

    # ---- Memory --------------------------------------------------------------

    MemoryQueryRequest:
      type: object
      required: [query]
      description: Request body for a memory search.
      properties:
        query:
          type: string
          minLength: 1
          description: Free-text search query.
          example: "OAuth token refresh flow"
        limit:
          type: integer
          format: int32
          minimum: 1
          default: 10
          description: Maximum number of results to return (default 10).
          example: 5
        namespace:
          type: [string, "null"]
          description: Optional namespace filter.
          example: "code-context"

    MemoryResult:
      type: object
      required: [id, content, score, created_at]
      description: A single memory search result.
      properties:
        id:
          type: string
          format: uuid
          description: Memory item identifier.
          example: "018f47a0-7b2c-7d91-8f0a-58ef65026f0f"
        content:
          type: string
          description: Content of the memory.
          example: "The OAuth token refresh endpoint is POST /oauth/token."
        score:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          description: Relevance score (0.0 = least relevant, 1.0 = most relevant).
          example: 0.92
        namespace:
          type: [string, "null"]
          description: Namespace/type of the memory.
          example: "code-context"
        created_at:
          type: string
          format: date-time
          description: When the memory entry was created.

    MemoryQueryResponse:
      type: object
      required: [version, data]
      description: Memory search results.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemoryResult"

    MemoryStatsResponse:
      type: object
      required: [version, total_memories, total_bytes, namespaces]
      description: Aggregate statistics about the memory store.
      properties:
        version:
          type: string
          example: v1alpha1
        total_memories:
          type: integer
          format: int64
          description: Total number of stored memory entries.
          example: 12345
        total_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Sum of UTF-8 bytes in stored memory content fields.
          example: 5242880
        namespaces:
          type: integer
          format: int32
          minimum: 0
          maximum: 3
          description: Number of distinct canonical memory types currently stored.
          example: 3

    MemoryForgetRequest:
      type: object
      required: [entry_ids]
      description: Request body for deleting memory entries.
      properties:
        entry_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 1000
          description: IDs of entries to delete.
          example:
            - "018f47a0-7b2c-7d91-8f0a-58ef65026f0f"
            - "018f47a0-b46a-768f-98b7-780459cd934d"

    MemoryForgetResponse:
      type: object
      required: [version, deleted]
      description: Result of a memory deletion operation.
      properties:
        version:
          type: string
          example: v1alpha1
        deleted:
          type: integer
          format: int32
          description: Number of entries actually deleted.
          example: 2

    MemoryEntryResponse:
      type: object
      required: [version, data]
      description: A single memory entry.
      properties:
        version:
          type: string
          example: v1alpha1
        data:
          $ref: "#/components/schemas/MemoryResult"

    # ---- System --------------------------------------------------------------

    # ---- Durable interactions -----------------------------------------------

    InteractionAutonomyLevel:
      type: string
      description: Requested autonomy; policy and grants may narrow it.
      enum:
        - fully_supervised
        - supervised
        - assisted_autonomous
        - fully_autonomous

    InteractionState:
      type: string
      enum: [active, archived]

    InteractionTurnState:
      type: string
      enum:
        - pending
        - running
        - awaiting_approval
        - completed
        - failed
        - cancelled
        - timed_out

    InteractionTarget:
      description: Durable interaction execution target.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind:
              type: string
              const: agent
            id:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind:
              type: string
              const: group
            id:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              type: string
              const: auto
      discriminator:
        propertyName: kind

    InteractionBudgetLimits:
      type: object
      required: [max_cost_usd, max_tokens, max_input_tokens, max_output_tokens]
      properties:
        max_cost_usd:
          type: [number, "null"]
          format: double
          minimum: 0
        max_tokens:
          type: [integer, "null"]
          format: int64
          minimum: 0
        max_input_tokens:
          type: [integer, "null"]
          format: int64
          minimum: 0
        max_output_tokens:
          type: [integer, "null"]
          format: int64
          minimum: 0

    InteractionBudget:
      type: object
      required: [max_cost_usd, max_tokens, per_run, per_turn]
      properties:
        max_cost_usd:
          type: [number, "null"]
          format: double
          minimum: 0
        max_tokens:
          type: [integer, "null"]
          format: int64
          minimum: 0
        per_run:
          anyOf:
            - $ref: "#/components/schemas/InteractionBudgetLimits"
            - type: "null"
        per_turn:
          anyOf:
            - $ref: "#/components/schemas/InteractionBudgetLimits"
            - type: "null"

    InteractionConfig:
      type: object
      required: [target, model, provider, harness, autonomy, max_turns, budget]
      description: |
        Full domain projection stored with an interaction. The HTTP mutation
        surface currently supports only target and model; provider, harness,
        autonomy, maximum-turn, and budget values remain runtime defaults and
        have no HTTP update variant.
      properties:
        target:
          $ref: "#/components/schemas/InteractionTarget"
        model:
          type: [string, "null"]
        provider:
          type: [string, "null"]
        harness:
          type: [string, "null"]
        autonomy:
          $ref: "#/components/schemas/InteractionAutonomyLevel"
        max_turns:
          type: [integer, "null"]
          format: int32
          minimum: 1
        budget:
          anyOf:
            - $ref: "#/components/schemas/InteractionBudget"
            - type: "null"

    CreateHttpInteractionRequest:
      type: object
      additionalProperties: false
      required: [target, working_directory]
      description: |
        Creates a durable interaction. Unsupported model/provider fields are
        rejected instead of being silently ignored.
      properties:
        title:
          type: [string, "null"]
        target:
          $ref: "#/components/schemas/InteractionTarget"
        working_directory:
          type: string
          description: Absolute project directory used by the runtime.
          example: "/workspace/project"
        client_name:
          type: [string, "null"]
        client_session_id:
          type: [string, "null"]

    PromptHttpInteractionRequest:
      type: object
      additionalProperties: false
      required: [prompt, working_directory]
      description: Text-only prompt accepted by the durable HTTP surface.
      properties:
        turn_id:
          type: [string, "null"]
          format: uuid
          description: Caller-generated idempotency identity.
        prompt:
          type: string
          minLength: 1
        working_directory:
          type: string
          description: Absolute project directory used by the runtime.
          example: "/workspace/project"
        client_name:
          type: [string, "null"]
        client_session_id:
          type: [string, "null"]

    UpdateHttpInteractionConfigRequest:
      description: |
        One atomic update for exactly one option implemented by the shared
        runtime. No provider, harness, autonomy, maximum-turn, or budget
        variant is accepted.
      oneOf:
        - type: object
          additionalProperties: false
          required: [option, value]
          properties:
            option:
              type: string
              const: target
            value:
              $ref: "#/components/schemas/InteractionTarget"
        - type: object
          additionalProperties: false
          required: [option, value]
          properties:
            option:
              type: string
              const: model
            value:
              type: [string, "null"]
              minLength: 1
              description: Canonicalizable model selector, or null to inherit the agent model.
      discriminator:
        propertyName: option

    HttpInteractionConfig:
      type: object
      additionalProperties: false
      required: [target, model]
      description: The two durable configuration options supported by the HTTP surface.
      properties:
        target:
          $ref: "#/components/schemas/InteractionTarget"
        model:
          type: [string, "null"]
          description: Canonical model override, or null to inherit the selected agent model.

    UpdateHttpInteractionTargetRequest:
      type: object
      additionalProperties: false
      required: [target]
      description: Deprecated target-only compatibility request.
      properties:
        target:
          $ref: "#/components/schemas/InteractionTarget"

    InteractionSummary:
      type: object
      required: [conversation_id, title, config, state, turn_count, created_at, updated_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        config:
          $ref: "#/components/schemas/InteractionConfig"
        state:
          $ref: "#/components/schemas/InteractionState"
        turn_count:
          type: integer
          format: int32
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HttpInteractionResponse:
      type: object
      required: [version, interaction]
      properties:
        version:
          type: string
          const: v1alpha1
        interaction:
          $ref: "#/components/schemas/InteractionSummary"

    ListHttpInteractionsResponse:
      type: object
      required: [version, data, cursor, meta]
      properties:
        version:
          type: string
          const: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/InteractionSummary"
        cursor:
          $ref: "#/components/schemas/CursorInfo"
        meta:
          $ref: "#/components/schemas/PageMeta"

    InteractionTurnHandle:
      type: object
      required: [turn_id, conversation_id, run_ids, first_event_sequence]
      properties:
        turn_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        run_ids:
          type: array
          items:
            type: string
            format: uuid
        first_event_sequence:
          type: integer
          format: int64
          minimum: 1

    InteractionTurnSummary:
      type: object
      required: [handle, ordinal, state, started_at, completed_at]
      properties:
        handle:
          $ref: "#/components/schemas/InteractionTurnHandle"
        ordinal:
          type: integer
          format: int32
          minimum: 1
        state:
          $ref: "#/components/schemas/InteractionTurnState"
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    ListHttpInteractionTurnsResponse:
      type: object
      required: [version, data]
      properties:
        version:
          type: string
          const: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/InteractionTurnSummary"

    PromptHttpInteractionResponse:
      type: object
      required: [version, handle]
      properties:
        version:
          type: string
          const: v1alpha1
        handle:
          $ref: "#/components/schemas/InteractionTurnHandle"

    CancelHttpInteractionTurnResponse:
      type: object
      required: [version, turn]
      properties:
        version:
          type: string
          const: v1alpha1
        turn:
          $ref: "#/components/schemas/InteractionTurnSummary"

    HttpInteractionConfigResponse:
      type: object
      required: [version, config]
      properties:
        version:
          type: string
          const: v1alpha1
        config:
          $ref: "#/components/schemas/HttpInteractionConfig"

    UpdateHttpInteractionTargetResponse:
      type: object
      required: [version, config]
      description: Deprecated target-only compatibility response.
      properties:
        version:
          type: string
          const: v1alpha1
        config:
          $ref: "#/components/schemas/InteractionConfig"

    InteractionReplayCheckpoint:
      type: object
      required: [next_after_sequence, has_more]
      properties:
        next_after_sequence:
          type: integer
          format: int64
          minimum: 0
          description: Safe checkpoint for the next replay request.
        has_more:
          type: boolean
          description: Whether another matching event is already durable.

    InteractionErrorCode:
      type: string
      enum:
        - invalid_request
        - not_found
        - conflict
        - busy
        - permission_denied
        - invalid_config
        - unsupported
        - unavailable
        - internal

    InteractionDomainError:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          $ref: "#/components/schemas/InteractionErrorCode"
        message:
          type: string
        retryable:
          type: boolean
        details:
          description: Optional redacted structured context.

    InteractionUsageView:
      type: object
      required:
        - input_tokens
        - output_tokens
        - cache_read_tokens
        - cache_write_tokens
        - cost_usd
        - remaining_tokens
        - remaining_cost_usd
      properties:
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        cache_read_tokens:
          type: integer
          format: int64
          minimum: 0
        cache_write_tokens:
          type: integer
          format: int64
          minimum: 0
        cost_usd:
          type: [number, "null"]
          format: double
        remaining_tokens:
          type: [integer, "null"]
          format: int64
          minimum: 0
        remaining_cost_usd:
          type: [number, "null"]
          format: double

    InteractionTurnResult:
      type: object
      required: [text, run_ids, usage]
      properties:
        text:
          type: string
        run_ids:
          type: array
          items:
            type: string
            format: uuid
        usage:
          $ref: "#/components/schemas/InteractionUsageView"

    InteractionRunRole:
      description: Role of a run linked to an interaction turn.
      oneOf:
        - type: string
          enum: [primary, coordinator]
        - type: object
          additionalProperties: false
          required: [child]
          properties:
            child:
              type: string

    InteractionToolLocation:
      type: object
      required: [path, line, column]
      properties:
        path:
          type: string
        line:
          type: [integer, "null"]
          format: int32
          minimum: 1
        column:
          type: [integer, "null"]
          format: int32
          minimum: 1

    InteractionToolCallView:
      type: object
      required: [call_id, run_id, name, title, kind, status]
      properties:
        call_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        name:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [read, write, execute, network, chain, other]
        status:
          type: string
          enum: [pending, in_progress, awaiting_approval, succeeded, failed, cancelled, unknown]
        arguments:
          description: Optional redacted structured arguments.
        summary:
          type: string
        output:
          description: Optional redacted structured output.
        locations:
          type: array
          items:
            $ref: "#/components/schemas/InteractionToolLocation"
        diff:
          type: string
        error:
          type: string

    InteractionPlanEntryView:
      type: object
      required: [entry_id, title, description, status, run_ids]
      properties:
        entry_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, in_progress, completed, failed, cancelled]
        run_ids:
          type: array
          items:
            type: string
            format: uuid

    InteractionApprovalView:
      type: object
      required:
        - approval_id
        - effect_id
        - run_id
        - tool_call_id
        - title
        - description
        - status
        - policy_reason
        - expires_at
      properties:
        approval_id:
          type: string
          format: uuid
        effect_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        tool_call_id:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, approved, denied, expired, cancelled]
        policy_reason:
          type: [string, "null"]
        expires_at:
          type: [string, "null"]
          format: date-time

    InteractionApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
        reason:
          type: [string, "null"]

    InteractionRunState:
      type: object
      required: [state]
      description: Tagged durable run state; fields apply to the matching state.
      properties:
        state:
          type: string
          enum:
            - created
            - queued
            - running
            - awaiting_approval
            - waiting_effect
            - completing
            - completed
            - failed
            - cancelled
            - timed_out
        request_id:
          type: string
        pending_intent_ids:
          type: array
          items:
            type: string
            format: uuid
        reason:
          type: string

    InteractionEvent:
      description: Stable tagged event vocabulary stored for durable replay.
      discriminator:
        propertyName: type
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, target, runs]
          properties:
            type:
              type: string
              const: turn_started
            target:
              $ref: "#/components/schemas/InteractionTarget"
            runs:
              type: array
              items:
                type: array
                minItems: 2
                maxItems: 2
                prefixItems:
                  - type: string
                    format: uuid
                  - $ref: "#/components/schemas/InteractionRunRole"
        - type: object
          additionalProperties: false
          required: [type, run_id, text]
          properties:
            type:
              type: string
              const: agent_message_delta
            run_id:
              type: string
              format: uuid
            text:
              type: string
        - type: object
          additionalProperties: false
          required: [type, run_id, text]
          properties:
            type:
              type: string
              const: thought_delta
            run_id:
              type: string
              format: uuid
            text:
              type: string
        - type: object
          additionalProperties: false
          required: [type, call]
          properties:
            type:
              type: string
              const: tool_call_started
            call:
              $ref: "#/components/schemas/InteractionToolCallView"
        - type: object
          additionalProperties: false
          required: [type, call]
          properties:
            type:
              type: string
              const: tool_call_updated
            call:
              $ref: "#/components/schemas/InteractionToolCallView"
        - type: object
          additionalProperties: false
          required: [type, entries]
          properties:
            type:
              type: string
              const: plan_updated
            entries:
              type: array
              items:
                $ref: "#/components/schemas/InteractionPlanEntryView"
        - type: object
          additionalProperties: false
          required: [type, request]
          properties:
            type:
              type: string
              const: approval_requested
            request:
              $ref: "#/components/schemas/InteractionApprovalView"
        - type: object
          additionalProperties: false
          required: [type, approval_id, decision]
          properties:
            type:
              type: string
              const: approval_resolved
            approval_id:
              type: string
              format: uuid
            decision:
              $ref: "#/components/schemas/InteractionApprovalDecision"
        - type: object
          additionalProperties: false
          required: [type, usage]
          properties:
            type:
              type: string
              const: usage_updated
            usage:
              $ref: "#/components/schemas/InteractionUsageView"
        - type: object
          additionalProperties: false
          required: [type, run_id, state]
          properties:
            type:
              type: string
              const: run_state_changed
            run_id:
              type: string
              format: uuid
            state:
              $ref: "#/components/schemas/InteractionRunState"
        - type: object
          additionalProperties: false
          required: [type, result]
          properties:
            type:
              type: string
              const: turn_completed
            result:
              $ref: "#/components/schemas/InteractionTurnResult"
        - type: object
          additionalProperties: false
          required: [type, error]
          properties:
            type:
              type: string
              const: turn_failed
            error:
              $ref: "#/components/schemas/InteractionDomainError"
        - type: object
          additionalProperties: false
          required: [type, reason]
          properties:
            type:
              type: string
              const: turn_cancelled
            reason:
              type: [string, "null"]
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              const: turn_timed_out

    InteractionEventEnvelope:
      type: object
      required: [event_id, conversation_id, turn_id, sequence, timestamp, event]
      properties:
        event_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        timestamp:
          type: string
          format: date-time
        event:
          $ref: "#/components/schemas/InteractionEvent"

    ReplayInteractionEventsResponse:
      type: object
      required: [version, data, checkpoint]
      properties:
        version:
          type: string
          const: v1alpha1
        data:
          type: array
          items:
            $ref: "#/components/schemas/InteractionEventEnvelope"
        checkpoint:
          $ref: "#/components/schemas/InteractionReplayCheckpoint"

    ConfigSummary:
      type: object
      required: [bind_address, database_backend, max_concurrent_runs]
      description: Non-secret subset of the active server configuration.
      properties:
        bind_address:
          type: string
          description: The address the API server is bound to.
          example: "0.0.0.0:9090"
        database_backend:
          type: string
          description: Database backend type.
          enum: [sqlite, postgres]
          example: sqlite
        max_concurrent_runs:
          type: integer
          format: int32
          description: Maximum number of runs that may execute simultaneously.
          example: 10

    SystemInfoResponse:
      type: object
      required: [version, platform_version, uptime_secs, config_summary]
      description: Platform version, uptime, and configuration summary.
      properties:
        version:
          type: string
          description: API version string.
          example: v1alpha1
        platform_version:
          type: string
          description: Polkagent platform version from the Cargo manifest.
          example: "0.1.0"
        uptime_secs:
          type: integer
          format: int64
          description: Seconds since the server process started.
          example: 3600
        config_summary:
          $ref: "#/components/schemas/ConfigSummary"

    # -----------------------------------------------------------------------
    # PCA C1 Bridge schemas (PRD-06 §20.4)
    # -----------------------------------------------------------------------

    BridgeHealthResponse:
      type: object
      required: [identity, transport, capabilities]
      description: C1 bridge health report.
      properties:
        identity:
          $ref: "#/components/schemas/BridgeIdentityInfo"
        transport:
          $ref: "#/components/schemas/BridgeTransportInfo"
        capabilities:
          $ref: "#/components/schemas/BridgeCapabilities"
        degraded:
          type: array
          items:
            type: string
          description: List of degraded subsystems, if any.

    BridgeIdentityInfo:
      type: object
      required: [bot_id, display_name]
      properties:
        bot_id:
          type: string
          example: my-bot
        display_name:
          type: string
          example: My Bot

    BridgeTransportInfo:
      type: object
      required: [connected, protocol]
      properties:
        connected:
          type: boolean
          example: true
        protocol:
          type: string
          example: polkagent-c1

    BridgeCapabilities:
      type: object
      required: [send, edit, react, typing, media]
      properties:
        send:
          type: boolean
        edit:
          type: boolean
        react:
          type: boolean
        typing:
          type: boolean
        media:
          type: boolean

    BridgeInboundResponse:
      type: object
      required: [deliveries]
      description: Pending inbound deliveries.
      properties:
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/BridgeDelivery"

    BridgeDelivery:
      type: object
      required: [delivery_id, lease_id, lease_ms, chat_id, message_id, kind, text]
      description: A single inbound delivery with an active lease.
      properties:
        delivery_id:
          type: string
        lease_id:
          type: string
        lease_ms:
          type: integer
          format: int64
        chat_id:
          type: string
        message_id:
          type: string
        kind:
          type: string
        text:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/BridgeAttachment"

    BridgeAttachment:
      type: object
      required: [id, mime, size, media_id, url]
      properties:
        id:
          type: string
        mime:
          type: string
        size:
          type: integer
          format: int64
        media_id:
          type: string
        url:
          type: string

    BridgeAckRequest:
      type: object
      required: [delivery_id, lease_id]
      properties:
        delivery_id:
          type: string
        lease_id:
          type: string

    BridgeAckResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    BridgeRenewRequest:
      type: object
      required: [delivery_id, lease_id]
      properties:
        delivery_id:
          type: string
        lease_id:
          type: string

    BridgeRenewResponse:
      type: object
      required: [ok, new_lease_ms]
      properties:
        ok:
          type: boolean
        new_lease_ms:
          type: integer
          format: int64

    BridgeSendRequest:
      type: object
      required: [chat_id, text]
      properties:
        chat_id:
          type: string
        text:
          type: string
        delivery_id:
          type: string
        lease_id:
          type: string
        reply_to:
          type: string
        edit:
          type: string

    BridgeSendResponse:
      type: object
      required: [ok, message_id]
      properties:
        ok:
          type: boolean
        message_id:
          type: string
