    get:
      operationId: getToolGrants
      summary: Get tool grant requirements
      tags: [tools]
      description: |
        Returns the required grant pattern for a single tool.
        Returns `501 Not Implemented` when no tool registry is configured.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "200":
          description: Tool grant information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolGrantsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  # ==========================================================================
  # Payments
  # ==========================================================================

  /api/v1alpha1/payments/balance:
    get:
      operationId: getPaymentBalance
      summary: Get payment balance
      tags: [payments]
      description: |
        Returns the current agent budget and available balance summary.
        Returns `501 Not Implemented` when no payment store is configured.
      responses:
        "200":
          description: Balance information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentBalanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
