        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1alpha1/conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        description: Conversation UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: addConversationMessage
      summary: Append a transcript message
      tags: [conversations]
      description: |
        Appends storage only and does not initiate agent execution. Use
        `POST /interactions/{id}/prompt` for an actionable durable prompt.
        Returns `501 Not Implemented` when no conversation store is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "201":
          description: Transcript message appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMessageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "500":
          $ref: "#/components/responses/InternalError"

