[meta]
api_version = "polkagent.dev/v1alpha1"
schema_version = 1

[log]
level = "info"
format = "pretty"

[database]
backend = "sqlite"

[database.sqlite]
path = "~/.local/share/polkagent/polkagent.db"
wal_mode = true
busy_timeout_ms = 5000
checkpoint_on_startup = false

[database.postgres]
max_connections = 20
ssl_mode = "require"

[execution]
max_concurrent_runs = 10
default_timeout_secs = 600

[execution.budget]
max_usd_per_run = 5.00
max_usd_per_day = 50.00
warn_threshold_percent = 80

[[providers]]
id = "anthropic-default"
provider_type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"
default_model = "claude-sonnet-4-6"
timeout_secs = 120
max_retries = 3

[policy]
policy_dir = "~/.config/polkagent/policies"
default_policy = "default"

[memory]
enabled = false
backend = "sqlite"

[api]
enabled = true
bind_address = "127.0.0.1:4840"
cors_origins = ["http://localhost:*"]

[tui]
theme = "dark"
atmospheric_effects = true
