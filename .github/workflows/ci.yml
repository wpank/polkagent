name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            msrv: false
          - toolchain: "1.89"
            msrv: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        if: ${{ !matrix.msrv }}
        run: cargo clippy --workspace -- -D warnings

      - name: cargo fmt
        if: ${{ !matrix.msrv }}
        run: cargo fmt --all -- --check

      - name: cargo doc
        if: ${{ !matrix.msrv }}
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Run slow / ignored tests
        # Restrict this pass to test targets. Rustdoc treats `ignore` examples
        # as runnable under `--ignored`, but those examples intentionally use
        # adapter placeholders and are not slow-test fixtures.
        run: cargo test --workspace --tests -- --ignored

  container-smoke:
    name: Authenticated container recovery and offline backup/restore smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      POLKAGENT_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/polkagent-container-smoke
    steps:
      - uses: actions/checkout@v4

      - name: Lint the container recovery probe
        run: |
          sh -n scripts/container-smoke.sh
          shellcheck scripts/container-smoke.sh

      - name: Install the SQLite backup integrity checker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sqlite3

      - name: Validate authenticated API recovery and offline SQLite restore
        run: ./scripts/container-smoke.sh

      - name: Upload container smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-smoke-auth-recovery-backup
          path: ${{ env.POLKAGENT_SMOKE_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7
